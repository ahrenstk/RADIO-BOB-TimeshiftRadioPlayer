<!DOCTYPE html>
<html lang="en" translate="no" class="notranslate">
	<head>
	    <meta charset="UTF-8">
	    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
	    <title>Radio</title>
	    <link rel="manifest" href="manifest.json">
	    <meta name="theme-color" content="#0e0e0e">
	    <meta name="apple-mobile-web-app-capable" content="yes">
	    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	    <meta name="apple-mobile-web-app-title" content="Radio">
	    <link rel="apple-touch-icon" href="icon-192.png">
	    <meta name="mobile-web-app-capable" content="yes">
	    <link rel="icon" type="image/png" href="icon-192.png">
	    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
	    <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
	
			<style>
			:root {
			    --bg-main: #0e0e0e;
			    --bg-card: var(--bg-main);
			    --bg-input: #282828;
			    --bg-inactive: #444;
			    --clr-light: #cbd5e1;
			    --text-muted: #a0a0ab;
			    --text-disabled: #b0b0b0;
			    --text-select-disabled: #c5c5c5;
			    --clr-cyan: #52c5c5;
			    --border-width: 0.12em;
			}
			body {
			    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
			    background: var(--bg-main);
			    color: var(--clr-light);
			    display: flex;
			    flex-direction: column;
			    align-items: center;
			    justify-content: center;
			    height: 100dvh;
			    min-height: 100dvh;
			    box-sizing: border-box;
			    overscroll-behavior-y: contain;
			    overflow: hidden;
			    padding-top: env(safe-area-inset-top, 0px);
			    padding-bottom: env(safe-area-inset-bottom, 0px);
			    padding-left: env(safe-area-inset-left, 0px);
			    padding-right: env(safe-area-inset-right, 0px);
			    -webkit-tap-highlight-color: transparent;
			}
			body, .player-card {
			    touch-action: none;
			}
			.player-card {
			    position: relative;
			    background: var(--bg-card);
			    padding: 1.2em 1.5em;
			    width: min(92vw, 62vh);
			    border-radius: 1.5rem;
			    max-width: 28rem;
			    font-size: clamp(0.8125rem, 2.15vh, 1.25rem);
			    text-align: center;
			    display: flex;
			    flex-direction: column;
			    justify-content: center;
			    align-items: center;
			    gap: 2em;
			    overflow: hidden;
			    flex-shrink: 0;
			}
			.control-group {
			    display: flex;
			    flex-direction: column;
			    align-items: center;
			    gap: 0.8em;
			    width: 100%;
			}			
			.control-container {
			    display: flex;
			    flex-direction: column;
			    align-items: center;
			    gap: 0.35em;
			    width: 100%;
			}
			.station-select,
			.btn,
			#liveBtn,
			#startBtn,
			.split-btn-container,
			.switch-container,
			.volume-container,
			.buffer-row-container,
			.timer-container {
			    width: 100% !important;
			    max-width: 18em !important;
			    box-sizing: border-box;
			}
			.station-select,
			.btn,
			.switch-label {
			    height: 2.8em !important;
			    line-height: 1;
			    box-sizing: border-box;
			    border: var(--border-width) solid transparent;
			}
			.station-select {
			    background: var(--bg-input);
			    color: var(--clr-light);
			    border-radius: 99em;
			    font-size: 1em;
			    outline: none;
			    cursor: pointer;
			    text-align: center;
			    text-align-last: center;
			    appearance: none;
			    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 14 14' width='1em' height='1em'><text x='0' y='12' fill='%23cbd5e1' font-size='14'>▾</text></svg>");
			    background-repeat: no-repeat;
			    background-position: right 1.2em center;
			    border-color: var(--clr-light);
			    padding: 0 2.5em 0 1.5em;
			}
			.station-select.live-select {
			    border-color: var(--clr-light);
			    background-color: var(--bg-input);
			    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14'><text x='0' y='12' fill='%23cbd5e1' font-size='14'>▾</text></svg>");
			}
			.station-select option {
			    background: var(--bg-input);
			    color: var(--clr-light);
			    font-weight: normal;
			}
			.slider-volume,
			.slider-timer {
			    appearance: none;
			    width: 100%;
			    height: 0.5em;
			    border-radius: 0.35em;
			    outline: none;
			    cursor: pointer;
			}
            .slider-volume {
                background: linear-gradient(to right, var(--clr-light) 0%, var(--clr-light) 50%, var(--bg-inactive) 50%, var(--bg-inactive) 100%);
            }
			.slider-timer {
			    background: linear-gradient(to right, var(--clr-light) 0%, var(--clr-light) 0%, var(--bg-inactive) 0%, var(--bg-inactive) 100%);
			}
			.slider-volume::-webkit-slider-thumb,
			.slider-timer::-webkit-slider-thumb {
			    appearance: none;
			    width: 0.9em;
			    height: 0.9em;
			    border-radius: 50%;
			    background: var(--clr-light);
			    cursor: pointer;
			    box-shadow: 0 0.12em 0.25em rgba(0, 0, 0, 0.4);
			}
			
			.slider-volume::-moz-range-thumb,
			.slider-timer::-moz-range-thumb {
			    width: 0.9em;
			    height: 0.9em;
			    border: none;
			    border-radius: 50%;
			    background: var(--clr-light);
			    cursor: pointer;
			    box-shadow: 0 0.12em 0.25em rgba(0, 0, 0, 0.4);
			}
			.btn {
			    font-family: inherit;
			    background: transparent;
			    padding: 0 1.2em;
			    border-radius: 99em;
			    cursor: pointer;
			    min-width: 0;
			    flex-shrink: 0;
			    display: flex;
			    align-items: center;
			    justify-content: center;
			    outline: none;
			    font-size: 1em;
			    font-weight: normal;
			    touch-action: manipulation;
			    transition: background-color 0.1s ease, transform 0.05s ease;
			}

			#rewindBtn:active:not(:disabled),
			#skipBtn:active:not(:disabled),
			#rewindBtn2:active:not(:disabled),
			#skipBtn2:active:not(:disabled),
			#rewindBtn.active-touch:not(:disabled),
			#skipBtn.active-touch:not(:disabled),
			#rewindBtn2.active-touch:not(:disabled),
			#skipBtn2.active-touch:not(:disabled) {
			    background-color: var(--bg-input) !important;
			}
			.btn svg {
			    width: 1.15em;
			    height: 1.15em;
			    stroke: currentColor;
			    fill: currentColor;
			    display: block;
			}
			#startBtn svg,
			#liveBtn svg {
			    width: 0.95em;
			    height: 0.95em;
			}
			#startBtn {
			    border-color: var(--clr-light);
			    color: var(--clr-light);
			}
			#startBtn.buffering-mode {
			    border-color: var(--clr-light);
			    color: var(--clr-light);
			}
			#liveBtn {
			    border-color: var(--clr-light);
			    color: var(--clr-light);
			    letter-spacing: 0.06em;
			    gap: 0.5em;
			}
			#liveBtn.live-active {
			    border-color: var(--clr-light);
			    color: var(--clr-light);
			}
			.split-btn-container {
			    display: flex;
			    gap: 0.35em;
			    flex-shrink: 0;
			}
			.split-btn-container .btn {
			    flex: 1;
			    border-color: var(--clr-light);
			    color: var(--clr-light);
			    padding: 0 1.8em;
			}
			#rewindBtn,
			#rewindBtn2 {
			    border-radius: 99em 0 0 99em;
			}
			#skipBtn,
			#skipBtn2 {
			    border-radius: 0 99em 99em 0;
			}
			input:disabled,
			select:disabled,
			.btn:disabled {
			    opacity: 0.45 !important;
			    color: var(--text-disabled) !important;
			    border-color: var(--text-disabled) !important;
			    cursor: not-allowed;
			}
			.btn-active {
                background-color: var(--bg-input) !important;
                border-color: var(--clr-light) !important;
            }
			.station-select:disabled {
			    background-color: var(--bg-card);
			    color: var(--text-select-disabled) !important;
			    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 14 14' width='1em' height='1em'><text x='0' y='12' fill='%23b0b0b0' font-size='14'>▾</text></svg>") !important;
			}
			#statusDisplay {
			    font-family: inherit;
			    font-size: 1em;
			    font-weight: normal;
			    color: var(--clr-light);
			    min-height: 1em;
			    display: block;
			}
			#statusDisplay.status-buffering-active {
			    color: var(--clr-light);
			}
			#statusDisplay.status-frozen,
			#statusDisplay.status-buffering-idle {
			    color: var(--clr-light);
			}
			#statusDisplay.status-live {
			    color: var(--clr-light);
			}
			.volume-container,
			.buffer-row-container,
			.timer-container {
			    display: flex;
			    flex-direction: row;
			    align-items: center;
			    gap: 0.6em;
			}
			.split-buffer-wrapper {
			    display: flex;
			    align-items: center;
			    gap: 0.35em;
			    flex-grow: 1;
			    width: 100%;
			}
			.buffer-container,
			.split-buffer-wrapper .buffer-container {
			    flex: 1;
			    height: 0.6em;
			    background-color: var(--bg-inactive);
			    border-radius: 0.25em;
			    overflow: hidden;
			    position: relative;
			    width: 100%;
			}
			#rewind-bar-fg,
			#buffer-bar-fg {
			    height: 100%;
			    width: 0%;
			    position: absolute;
			    top: 0;
			    transition: width 0.3s ease;
			}
			#rewind-bar-fg {
			    right: 0;
			}
			#buffer-bar-fg {
			    left: 0;
			}
            .actively-buffering {
                background-color: var(--clr-cyan);
            }
			.buffer-underrun {
			    background-color: var(--clr-light);
			}
			.slider-volume,
			.slider-timer {
			    appearance: none;
			    width: 100%;
			    height: 0.5em;
			    border-radius: 0.35em;
			    outline: none;
			    cursor: pointer;
			    touch-action: pan-x;
			}
			.switch-container {
			    display: flex;
			    position: relative;
			    user-select: none;
			    box-sizing: border-box;
			    touch-action: pan-y;
			    width: 100%;
			    max-width: 17.5rem;
			}
			.switch-text svg {
			    width: 1em;
			    height: 1em;
			    stroke-width: 2.5;
			    stroke-linecap: round;
			    stroke-linejoin: round;
			    fill: none;
			    stroke: currentColor;
			    display: block;
			}
			.icon-spacer {
			    width: 1.15em;
		
			    height: 1.15em;
			    flex-shrink: 0;
			}
			.switch-checkbox {
			    display: none !important;
			}
			.switch-label {
			    display: flex;
			    align-items: center;
			    justify-content: space-between;
			    cursor: grab;
			    width: 100%;
			    background: transparent;
			    border-color: var(--clr-light);
			    border-radius: 99em;
			    position: relative;
			    padding: 0;
			}
			.switch-text {
			    font-size: 0.95rem;
			    z-index: 2;
			    width: 50%;
			    display: flex;
			    align-items: center;
			    justify-content: center;
			    pointer-events: none;
			}
			.switch-text-left {
			    color: var(--clr-light);
			}
			.switch-text-right {
			    color: var(--clr-light);
			}
			.switch-button {
			    position: absolute;
			    top: 0.18em;
			    left: 0.18em;
			    bottom: 0.18em;
			    width: calc(50% - 0.18em);
			    background-color: var(--bg-input);
			    border: var(--border-width) solid var(--clr-light);
			    border-radius: 99em;
			    transition:
			        transform 0.25s cubic-bezier(0.4, 0, 0.2, 1),
			        border-color 0.2s ease-in-out;
			    z-index: 1;
			    box-sizing: border-box;
			    cursor: grabbing;
			    pointer-events: auto;
			}
			.switch-checkbox:not(:checked) + .switch-label .switch-button {
			    transform: translateX(0);
			    border-color: var(--clr-light);
			    background-color: var(--bg-input);
			}
			.switch-checkbox:checked + .switch-label .switch-button {
			    transform: translateX(100%);
			    border-color: var(--clr-light);
			    background-color: var(--bg-input);
			}
			.switch-checkbox:disabled + .switch-label {
			    opacity: 0.45 !important;
			    background: var(--bg-card) !important;
			    border-color: var(--text-disabled, #b0b0b0) !important;
			    cursor: not-allowed;
			}
			.switch-checkbox:disabled + .switch-label .switch-text-left,
			.switch-checkbox:disabled + .switch-label .switch-text-right {
			    color: var(--text-disabled, #b0b0b0) !important;
			}
			.switch-checkbox:disabled + .switch-label .switch-button {
			    background-color: transparent !important;
			    border-color: var(--text-disabled, #b0b0b0) !important;
			}
			.switch-checkbox:checked:disabled + .switch-label .switch-button {
			    background-color: var(--bg-input) !important;
			    border: var(--border-width) solid var(--text-disabled, #b0b0b0) !important;
			}
			@keyframes buffer-flow {
			    from {
			        background-position: 0 0;
			    }
			    to {
			        background-position: 1em 0;
			    }
			}
		</style>
			
		
	</head>

    <body>

        <div class="player-card">
            <div class="control-group header-group">
                <div id="statusDisplay"></div>
                <div class="buffer-row-container">
                    <svg id="bufferIcon" class="icon-spacer" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 2h14M5 22h14M19 2v4a7 7 0 0 1-7 7 7 7 0 0 1-7-7V2M5 22v-4a7 7 0 0 1 7-7 7 7 0 0 1 7 7v4"></path></svg>

                    <input type="range" id="sleepTimerSlider" class="slider-timer" min="0" max="60" step="1" value="0" />
                    <div class="icon-spacer" aria-hidden="true"></div>
                </div>
            </div>
        </div>


	
		<script>
		    
			class ChunkDB {
			    
			    static MAX_CHUNKS = 180;
			    
			    constructor() {
			        const path = window.location.pathname;
			        const parts = path.split('/').filter(Boolean);
			        
			        if (parts.length > 0 && parts[parts.length - 1].includes('.')) {
			            parts.pop();
			        }
			        
			        this.dbName = `RADIO-BOB-TimeshiftRadioPlayer`;
			        this.storeName = "chunks";
			        this.settingsStoreName = "settings";
			        this.db = null;
			    }
			
			
			    delete(id) {
			        return new Promise((resolve, reject) => {
			            if (!this.db) return resolve();
			            const tx = this.db.transaction(this.storeName, "readwrite");
			            const store = tx.objectStore(this.storeName);
			            const request = store.delete(id);
			            request.onsuccess = () => resolve();
			            request.onerror = () => reject(request.error);
			        });
			    }
			
			
			    init() {
			        return new Promise((resolve, reject) => {
			            const request = indexedDB.open(this.dbName, 2);
			
			            request.onupgradeneeded = (e) => {
			                const db = e.target.result;
			                if (!db.objectStoreNames.contains(this.storeName)) {
			                    db.createObjectStore(this.storeName);
			                }
			                if (!db.objectStoreNames.contains(this.settingsStoreName)) {
			                    db.createObjectStore(this.settingsStoreName);
			                }
			            };
			
			            request.onsuccess = (e) => {
			                this.db = e.target.result;
			                this.db.onversionchange = () => {
			                    this.db.close();
			                };
			                resolve();
			            };
			
			            request.onerror = (e) => reject(e.target.error);
			        });
			    }
			
			
			    setSetting(key, value) {
			        return new Promise((resolve, reject) => {
			            const tx = this.db.transaction(this.settingsStoreName, "readwrite");
			            const store = tx.objectStore(this.settingsStoreName);
			            const request = store.put(value, key);
			            request.onsuccess = () => resolve();
			            request.onerror = () => reject(request.error);
			        });
			    }
			
			
				getAllChunksData(keys) {
				    if (!keys || keys.length === 0) return [];
				
				    const results = [];
				
				    for (let i = 0; i < keys.length; i++) {
				        const key = keys[i];
				        const parts = key.split('_');
				
				        if (parts.length >= 4) {
				            results.push({ 
				                id: key, 
				                length: parseInt(parts[2], 10), 
				                startTime: parseInt(parts[1], 10) 
				            });
				        }
				    }
				    return results.sort((a, b) => a.startTime - b.startTime);
				}
			
			
			    getSetting(key) {
			        return new Promise((resolve) => {

				checkLiveStreamSwitch() {
				    if (!this.state.isLiveMode || this.ui.isLiveSwitching) return;
				
				    const selected = this.livestations[this.ui.els.liveStationSelect.value];
				    if (selected?.url && this.dynamicUrls[selected.url]) {
				        const targetUrl = this.getLiveUrl(selected.url);
				        const absoluteTargetUrl = new URL(targetUrl, window.location.href).href;
				        const absoluteCurrentUrl = this.ui.els.liveAudio.src ? new URL(this.ui.els.liveAudio.src, window.location.href).href : '';
				
				
				        if (absoluteTargetUrl !== absoluteCurrentUrl) {
				            this.ui.switchLiveStreamTo(targetUrl);

			    async init() {
			        this.ui.collectElements();
			        await this.chunkDB.init();
			        await this.ui.initStations();
			        await this.loadStoredChunks();
			        this.ui.bindEvents();
			        this.startWatchdog();
			        this.registerServiceWorker();
			    }
			    

			    
				getLiveUrl(streamType = "dynamic") {
				    const stream = this.dynamicUrls[streamType];
				    if (!stream) return "";
				
				    const minute = new Date().getMinutes();
				    
				    const switchMinutes = [3, 27, 33, 57];
				    
				    let activeIndex = -1;
				    for (let i = 0; i < switchMinutes.length; i++) {
				        if (minute >= switchMinutes[i]) {
				            activeIndex = i;
				        }
				    }
				    
				    if (activeIndex === -1) {
				        activeIndex = switchMinutes.length - 1;
				    }
				    
				    const isPrimary = (activeIndex % 2 === 0);
				
				    return isPrimary ? stream.primary : stream.secondary;
				}			    
			    

			    startWatchdog() {
			        if (this.state.watchdogIntervalId) clearInterval(this.state.watchdogIntervalId);
			        this.ui.update();
			        this.state.watchdogIntervalId = setInterval(() => {
			            this.handleSleepTimer();
			            this.streamer.ensureConnection();
			            this.checkLiveStreamSwitch();
			            this.ui.update();
			        }, 1000);
			    }
			
			    
			    handleSleepTimer() {
			        if (!this.state.sleepTimerEndTime) return;
			        
			        const remainingTime = this.state.sleepTimerEndTime - Date.now();
			        if (remainingTime <= 0) {
			            this.state.sleepTimerEndTime = null;
			            if (this.state.isLiveMode) this.ui.stopLiveMode();
			            if (this.state.isPlaying) this.player.pause();
			            this.player.resetScheduledPlayback();
			        }
			    }
			    
			
			    async requestWakeLock() {
			    if ('wakeLock' in navigator) {
			        try {
			            if (!this.state.wakeLock) {
			                    this.state.wakeLock = await navigator.wakeLock.request('screen').catch(() => null);
			                    if (this.state.wakeLock) {
			                        this.state.wakeLock.addEventListener('release', () => { this.state.wakeLock = null; });
			                    }
			                }
			            } catch (err) {}
			        }
			    }
		
			    
			    async loadStoredChunks() {
			        this.ui.els.startBtn.disabled = true;
			        this.ui.els.statusDisplay.innerText = "";
			        this.ui.els.statusDisplay.className = "status-frozen";
			
			        const savedBitrate = await this.chunkDB.getSetting("lastDetectedBitrate");
			        if (savedBitrate) {
			            this.state.bitrate = savedBitrate;
			        }

			        const keys = await this.chunkDB.getAllKeys();
			        if (!keys || keys.length === 0) {
			            this.state.isStopped = true;
			            this.state.isPlaying = false;
			            this.state.isNetworkFrozen = true;
			            
			            this.ui.els.statusDisplay.innerText = "";
			            this.ui.els.statusDisplay.className = "";
			            this.ui.update();
			            return;
			        }
			
			        keys.sort((a, b) => {
			            const timeA = parseInt(a.split('_')[1], 10) || 0;
			            const timeB = parseInt(b.split('_')[1], 10) || 0;
			            return timeA - timeB;
			        });
			        
			        const KEEP_CHUNKS = ChunkDB.MAX_CHUNKS;
			        if (keys.length > KEEP_CHUNKS) {
			            const excessKeys = keys.slice(0, keys.length - KEEP_CHUNKS);
			            keys.splice(0, keys.length - KEEP_CHUNKS);
			
			            await new Promise((resolve, reject) => {
			                const tx = this.chunkDB.db.transaction(this.chunkDB.storeName, "readwrite");
			                const store = tx.objectStore(this.chunkDB.storeName);
			                
			                for (let i = 0; i < excessKeys.length; i++) {
			                    store.delete(excessKeys[i]);
			                }
			                
			                tx.oncomplete = () => resolve();
			                tx.onerror = (e) => reject(tx.error || e.target.error);
			                tx.onabort = () => reject(new Error("Transaction aborted"));
			            });
			        }
			
			        const loadedChunks = this.chunkDB.getAllChunksData(keys);
			        if (loadedChunks.length > 0) {
			            this.state.isStopped = false;
			            this.state.isPlaying = false;
			            this.state.isNetworkFrozen = true;
			            this.state.firstChunkTimestamp = loadedChunks[0].startTime;
			
			            const lastActiveId = await this.chunkDB.getSetting("lastPlayingChunkId");
			            let targetIndex = lastActiveId ? loadedChunks.findIndex(c => c.id === lastActiveId) : -1;
			
			            if (targetIndex !== -1) {
			                this.state.playedChunksHistory = loadedChunks.slice(0, targetIndex);
			                this.state.playlistChunks = loadedChunks.slice(targetIndex);
			                
			                const lastOffset = await this.chunkDB.getSetting("lastPlayingChunkOffset");
			                if (lastOffset) {
			                    this.player.currentChunkOffset = parseFloat(lastOffset);
			                }
			            } else {
			                if (loadedChunks.length > 1) {
			                    this.state.playedChunksHistory = loadedChunks.slice(0, -1);
			                    this.state.playlistChunks = [loadedChunks[loadedChunks.length - 1]];
			                } else {
			                    this.state.playlistChunks = [loadedChunks[0]];
			                }
			            }
			        } else {
			            this.state.isStopped = true;
			            this.state.isNetworkFrozen = true;
			        }
			        
			        this.ui.update();
			        this.ui.els.statusDisplay.innerText = "Timeshift (Loaded)";
			        this.ui.els.statusDisplay.className = "status-frozen";
			        this.ui.els.startBtn.disabled = false;
			        this.ui.els.startBtn.innerText = "Start Timeshift";
			    }

			    
			
			    async startRadio() {
			        if (!this.state.isStopped) return;
			
			        this.state.playlistChunks = [];
			        this.state.playedChunksHistory = [];
			        this.state.currentPlayingChunkData = null;
			
			        this.streamer.connect();
			        
			        this.state.isStopped = false;
			        this.state.firstChunkTimestamp = Date.now();
			        this.state.isNetworkFrozen = false;
			        
			        await this.player.initAudioContext();
			        
			        this.state.isPlaying = false;
			        this.requestWakeLock();
			    }
			    
			    
			    async toggleNetworkFreeze() {
			        if (this.state.isStopped) return;
			        
			        if (!this.state.isNetworkFrozen) {
			             if (this.streamer && this.streamer.chunkProcessor) {
			                await this.streamer.chunkProcessor.process(new Uint8Array(0), true);
			            }
			        }
			
			        this.state.isNetworkFrozen = !this.state.isNetworkFrozen;
			        if (this.state.isNetworkFrozen) {
			            this.streamer.disconnect();
			        } else {
			            await this.streamer.connect();
			        }
			        this.ui.update();
			    }
			
			    
				registerServiceWorker() {
				    if (!('serviceWorker' in navigator)) return;
				
				    let refreshing = false;

				    this._onControllerChange = () => {
				        if (!refreshing) {
				            refreshing = true;
				            window.location.reload();
				        }
				    };
				
				    this._onVisibilityChangeSW = () => {
				        if (document.visibilityState === 'visible' && this._swRegistration) {
				            this._swRegistration.update().catch(() => {});
				        }
				    };
				
                    this._initSW = async () => {
				        try {
				            this._swRegistration = await navigator.serviceWorker.register('./sw.js');
				            this._swRegistration.update().catch(() => {});

				            document.addEventListener('visibilitychange', this._onVisibilityChangeSW);
				        } catch (err) {
				        }
				    };
				
				    this._onLoadSW = () => {
				        this._initSW();
				    };
				
				    navigator.serviceWorker.addEventListener('controllerchange', this._onControllerChange);
				
				    if (document.readyState === 'complete') {
				        this._initSW();
				    } else {
				        window.addEventListener('load', this._onLoadSW);
				    }
				}


			}
			
			class UIManager {
			    
			    constructor(app) {
			        this.app = app;
			        this.state = app.state;
			        this.els = {};
			        this.isLiveSwitching = false;
			        this.targetLiveVolume = 1.0;
                    this.fadeInterval = null;
			
			        this.icons = {
			            play: `<svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>`,
			            pause: `<svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>`,
			
			        };
			    }
			    
			    
			    collectElements() {
			        const ids = [
			            "statusDisplay", "bufferIcon", "rewind-bar-fg", "buffer-bar-fg", 
			            "liveStationSelect", "stationSelect", "liveAudio", "liveBtn", "startBtn",
			            "stopSwitch", "rewindBtn", "skipBtn", "rewindBtn2", "skipBtn2", 
			            "volumeSlider", "sleepTimerSlider"
			        ];
			        ids.forEach(id => this.els[id] = document.getElementById(id));
			        this.els.switchContainer = document.querySelector(".switch-container");
			        this.els.switchButton = this.els.switchContainer.querySelector('.switch-button');
			        this.els.switchLabel = this.els.switchContainer.querySelector('.switch-label');
			    }
			

				destroy() {
				    if (this._onOnline) {
				        window.removeEventListener('online', this._onOnline);
				        window.removeEventListener('offline', this._onOffline);
				        window.removeEventListener('beforeunload', this._onBeforeUnload);
				        document.removeEventListener('visibilitychange', this._onVisibilityChange);
				        document.removeEventListener('gesturestart', this._onGestureStart);
				        document.removeEventListener('touchend', this._onTouchEnd);
				        document.removeEventListener('touchcancel', this._onTouchEnd);
				

				        if ('serviceWorker' in navigator && this.app._onControllerChange) {
				            navigator.serviceWorker.removeEventListener('controllerchange', this.app._onControllerChange);
				        }
				        if (this.app._onVisibilityChangeSW) {
				            document.removeEventListener('visibilitychange', this.app._onVisibilityChangeSW);
				        }
				        if (this.app._onLoadSW) {
				            window.removeEventListener('load', this.app._onLoadSW);
				        }
				    }
				}
				
					

			    async initStations() {
			        this.app.stations.forEach((station, index) => {
			            const option = document.createElement('option');
			            option.value = index;
			            option.textContent = station.name;
			            this.els.stationSelect.appendChild(option);
			        });
			
			        this.app.livestations.forEach((station, index) => {
			            const option = document.createElement('option');
			            option.value = index;
			            option.textContent = station.name;
			            this.els.liveStationSelect.appendChild(option);
			        });
			
					const savedName = await this.app.chunkDB.getSetting("selectedStationName");
					let targetIndex = this.app.stations.findIndex(s => s.name === savedName);
					if (targetIndex === -1) targetIndex = 0;
					
					this.els.stationSelect.value = targetIndex;
					this.state.streamUrl = this.app.stations[targetIndex].url;
					

			        this.state.bitrate = 128000;
			
					const savedLiveName = await this.app.chunkDB.getSetting("selectedLiveStationName");
					let targetLiveIndex = this.app.livestations.findIndex(s => s.name === savedLiveName);
					if (targetLiveIndex === -1) targetLiveIndex = 0;
					
					this.els.liveStationSelect.value = targetLiveIndex;
			        
			        this.els.startBtn.innerHTML = this.icons.play;
			    }
		
			
				bindEvents() {
				    this.els.startBtn.addEventListener('click', () => {
				        if (this.state.isLiveMode) this.stopLiveMode();
				        if (this.state.isDecoding) return;
				        
				        if (this.state.isStopped) this.app.startRadio();
				        else if (this.state.isPlaying) this.app.player.pause();
				        else this.app.player.play();
				        this.update();
				    });
				
				    this.els.liveBtn.addEventListener('click', () => {
				        if (!this.state.isLiveMode) this.startLiveMode();
				        else this.stopLiveMode();
				    });
				
				    this.els.rewindBtn.addEventListener('click', () => this.app.player.jumpChunks(-1));
				    this.els.rewindBtn2.addEventListener('click', () => this.app.player.jumpChunks(-10));
				    this.els.skipBtn.addEventListener('click', () => this.app.player.jumpChunks(1));
				    this.els.skipBtn2.addEventListener('click', () => this.app.player.jumpChunks(10));
				
				    this.#bindSwitch();
				    this.els.stationSelect.addEventListener('change', (e) => this.handleStationChange(e));
				    this.els.liveStationSelect.addEventListener('change', (e) => this.handleLiveStationChange(e));
				
				    this.els.volumeSlider.addEventListener('input', (e) => this.handleVolumeChange(e));
				    this.els.sleepTimerSlider.addEventListener('input', (e) => this.handleSleepTimerChange(e));
				    

				    this._onOnline = () => {
				        this.app.state.isConnected = true;
				        this.app.streamer.ensureConnection();
				    };
				    this._onOffline = () => {
				        this.app.state.isConnected = false;
				        this.app.streamer.disconnect(false);
				        this.update();
				    };
				    this._onBeforeUnload = (e) => {
				        e.preventDefault();
				        e.returnValue = true;
				    };
				    this._onVisibilityChange = () => {
				        if ((this.state.isPlaying || this.state.isLiveMode) && document.visibilityState === 'visible') {
				            this.app.requestWakeLock();
				        }
				    };
				    this._onGestureStart = (e) => {
				        e.preventDefault();
				    };
				    this._onTouchEnd = () => {
				        document.querySelectorAll('.btn').forEach(b => b.classList.remove('active-touch'));
				    };
				

				    window.addEventListener('online', this._onOnline);
				    window.addEventListener('offline', this._onOffline);
				    window.addEventListener('beforeunload', this._onBeforeUnload);
				    document.addEventListener('visibilitychange', this._onVisibilityChange);
				    document.addEventListener('gesturestart', this._onGestureStart);
				    document.addEventListener('touchend', this._onTouchEnd);
				    document.addEventListener('touchcancel', this._onTouchEnd);
				

                    this.els.liveAudio.addEventListener('loadedmetadata', () => {
					    if (!this.isLiveSwitching) return;
					    
					    this.els.liveAudio.play()
					        .then(() => {
					            this.isLiveSwitching = false;
					        })
					        .catch(() => {
					            this.isLiveSwitching = false;
					        });
					});
					
				    this.els.liveAudio.addEventListener('error', () => {
				        if (!this.isLiveSwitching) return;
				        this.isLiveSwitching = false;
				    });
				
				    this.els.startBtn.closest('.player-card').addEventListener('touchstart', (e) => {
				        const btn = e.target.closest('.btn');
				        if (btn && !btn.disabled) {
				            btn.classList.add('active-touch');
				        }
				    }, { passive: true });
				}
							    

							    
			
			    #bindSwitch() {
			        let isDragging = false, startX = 0, currentTranslate = 0;
			        const switchButton = this.els.switchButton;
			
			        const onPointerDown = (e) => {
			            if (this.state.isLiveMode || this.state.isDecoding) return;
			            isDragging = true;
			            startX = e.clientX || (e.touches ? e.touches[0].clientX : 0);
			            switchButton.style.transition = 'none';
			            e.preventDefault();
			
			            window.addEventListener('pointermove', onPointerMove);
			            window.addEventListener('pointerup', onPointerUp);
			        };
			
			        const onPointerMove = (e) => {
			            if (!isDragging) return;
			            const currentX = e.clientX || (e.touches ? e.touches[0].clientX : 0);
			            const diffX = currentX - startX;
			            const maxSlide = this.els.switchContainer.offsetWidth / 2 - 6;
			            const baseOffset = this.els.stopSwitch.checked ? maxSlide : 0;
			            currentTranslate = Math.max(-baseOffset, Math.min(maxSlide - baseOffset, diffX));
			            switchButton.style.transform = `translateX(${baseOffset + currentTranslate}px)`;
			        };
			
			        const onPointerUp = async () => {
			            if (!isDragging) return;
			            isDragging = false;
			
			
			            window.removeEventListener('pointermove', onPointerMove);
			            window.removeEventListener('pointerup', onPointerUp);
			
			            switchButton.style.transition = 'transform 0.25s cubic-bezier(0.4, 0, 0.2, 1)';
			            const threshold = (this.els.switchContainer.offsetWidth / 2 - 6) * 0.3;
			            let shouldToggle = (this.els.stopSwitch.checked && currentTranslate < -threshold) || 
			                               (!this.els.stopSwitch.checked && currentTranslate > threshold);
			            
			            if (shouldToggle) {
			                if (this.state.isStopped) {
			                    await this.app.startRadio();
			                } else {
			                    await this.app.toggleNetworkFreeze();
			                }
			            } else {
			                this.update();
			            }
			            currentTranslate = 0;
			        };
			        
			
			        this.els.switchContainer.addEventListener('pointerdown', onPointerDown);
			        this.els.switchLabel.addEventListener('click', (e) => e.preventDefault());
			    }
			
			
			    async handleStationChange(e) {
					const idx = parseInt(e.target.value, 10);
					    const station = this.app.stations[idx];
					    if (station) {
					        this.state.streamUrl = station.url;
					        await this.app.chunkDB.setSetting("selectedStationName", station.name);
					    }
			        
			        if (!this.state.isStopped && !this.state.isNetworkFrozen) {
			            this.app.streamer.disconnect();
			            this.app.streamer.connect();
			        }
			    }
			    
			    
			    async handleLiveStationChange(e) {
					const idx = parseInt(e.target.value, 10);
					    const station = this.app.livestations[idx];
					    if (station) {
					        await this.app.chunkDB.setSetting("selectedLiveStationName", station.name);
					    }
			        if (this.state.isLiveMode) {
			            this.stopLiveMode();
			            this.startLiveMode();
			        }
			    }
			
			
			    handleVolumeChange(e) {
			        const volume = e.target.value;
			        const linearVolume = volume / 100;
			        const finalGain = this.getPerceivedGain(linearVolume);
			        
			        if (this.state.isLiveMode) this.els.liveAudio.volume = finalGain;
			        if (this.app.player.gainNode) this.app.player.gainNode.gain.setValueAtTime(finalGain, this.app.player.audioCtx.currentTime);
			        e.target.style.background = `linear-gradient(to right, var(--clr-light) ${volume}%, var(--bg-inactive) ${volume}%)`;
			    }
			
			
			    handleSleepTimerChange(e) {
			        const minutes = parseInt(e.target.value) || 0;
			        const percentage = (minutes / (parseInt(e.target.max) || 60)) * 100;
			        e.target.style.background = `linear-gradient(to right, var(--clr-light) ${percentage}%, var(--bg-inactive) ${percentage}%)`;
			        this.state.sleepTimerEndTime = minutes > 0 ? Date.now() + minutes * 60000 : null;
			    }
			    
			    
			    startLiveMode() {
			        if (this.state.isLiveMode) return;
			        this.app.player.pause();
			
			        const selected = this.app.livestations[this.els.liveStationSelect.value];
			        let url = selected.url;
			        if (this.app.dynamicUrls[url]) {
			            url = this.app.getLiveUrl(url);
			        }
			
			        this.els.liveAudio.src = url;
			        this.els.liveAudio.load();
			        this.els.liveAudio.play().catch(()=>{});
			        this.state.isLiveMode = true;
			        
			        this.updateMediaSession(selected.name, "Live Radio Stream");
			        this.update();

				stopLiveMode() {
				    if (!this.state.isLiveMode) return; 
				    this.state.isLiveMode = false;
				    this.isLiveSwitching = false;

				    this.#cancelActiveLiveSwitch();
				    
				    const audio = this.els.liveAudio;
				    audio.pause();
				    audio.src = "";
				    audio.removeAttribute('src');
				    try {
				        audio.load();
				    } catch(e) {}
				    
				    this.update();
				}
				
				#cancelActiveLiveSwitch() {
				    this.isLiveSwitching = false;
				    const audio = this.els.liveAudio;
				    if (this.activeLiveSwitch) {
				        const s = this.activeLiveSwitch;
				        if (s.safetyTimeout) clearTimeout(s.safetyTimeout);
				        if (s.fadeInterval) clearInterval(s.fadeInterval);
				        
				        if (s.onMetadataLoaded) audio.removeEventListener('loadedmetadata', s.onMetadataLoaded);
				        if (s.onSwitchError) audio.removeEventListener('error', s.onSwitchError);
				        
				        this.activeLiveSwitch = null;
				    }
				}
				
				

				async switchLiveStreamTo(url) {
				    if (!url || !this.state.isLiveMode) return;
				
				    const absoluteTargetUrl = new URL(url, window.location.href).href;
				    const absoluteCurrentUrl = this.els.liveAudio.src ? new URL(this.els.liveAudio.src, window.location.href).href : '';
				
				    if (absoluteTargetUrl === absoluteCurrentUrl) return;
				    this.isLiveSwitching = true;
				    
				    const audio = this.els.liveAudio;
				
				    audio.pause();
				    audio.currentTime = 0;
				    audio.src = "";
				    audio.removeAttribute('src');
				    audio.load();
				
				    this.#cancelActiveLiveSwitch();
				    await new Promise(resolve => setTimeout(resolve, 50));
				
                    try {
				        audio.src = url;
				        const targetVolume = this.getPerceivedGain(this.els.volumeSlider.value / 100);
				        audio.volume = targetVolume;

				        await audio.play();

				    } catch (err) {
				        this.isLiveSwitching = false;
				    }
				}
				

			

			
			
			    update() {
			        this.#updateBufferBars();
			        this.#updateStatusDisplay();
			        this.#updateButtons();
			        this.#updateControls();
			        this.#updateSleepTimerSlider();
			    }
			
			
			    #updateBufferBars() {
			        let forwardPercent = 0, rewindPercent = 0;
			        const MAX_CHUNKS = 60;
			        
			        if (!this.state.isStopped) {
			            rewindPercent = Math.min((this.state.playedChunksHistory.length / MAX_CHUNKS) * 100, 100);
			            forwardPercent = Math.min((this.state.playlistChunks.length / MAX_CHUNKS) * 100, 100);
			        }
			        
			        this.els["rewind-bar-fg"].style.width = `${rewindPercent}%`;
			        this.els["buffer-bar-fg"].style.width = `${forwardPercent}%`;
			        
			        const barClass = !this.state.isStopped && !this.state.isNetworkFrozen && this.state.isConnected ? 'actively-buffering' : 'buffer-underrun';
			        this.els["rewind-bar-fg"].className = barClass;
			        this.els["buffer-bar-fg"].className = barClass;
			    }
			    
			
				#updateStatusDisplay() {
				    const formatBufferDuration = (s) => {
				        const d = Math.max(0, Math.floor(s));
				        const h = Math.floor(d / 3600);
				        const m = Math.floor((d % 3600) / 60);
				        const sec = Math.floor(d % 60);
				        return h > 0 ?
				            `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}` :
				            `${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
				    };
				
				    const formatTime = (ts) => {
				        const d = new Date(ts);
					    let weekdays = ["Su", "Mo", "Tu", "We", "Th", "Fr", "Sa"];
    					const browserLang = (navigator.language || '').toLowerCase();
    					if (browserLang.startsWith('de')) {
    					    weekdays = ["So", "Mo", "Di", "Mi", "Do", "Fr", "Sa"];
    					}
				        return `${weekdays[d.getDay()]} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
				    };
				
				    const getPlaybackTime = () => {
				        if (this.state.currentPlayingChunkData) {
				            return this.state.currentPlayingChunkData.startTime;
				        }
				        if (this.state.playlistChunks.length > 0) {
				            return this.state.playlistChunks[0].startTime;
				        }
				        if (this.state.playedChunksHistory.length > 0) {
				            return this.state.playedChunksHistory[this.state.playedChunksHistory.length - 1].startTime;
				        }
				        return this.state.firstChunkTimestamp || Date.now();
				    };
				
				    const getNewestTime = () => {
				        const lastPlaylist = this.state.playlistChunks.length > 0 
				            ? this.state.playlistChunks[this.state.playlistChunks.length - 1].startTime 
				            : 0;
				
				        const currentPlaying = this.state.currentPlayingChunkData
				            ? this.state.currentPlayingChunkData.startTime
				            : 0;
				
				        const newestSaved = Math.max(lastPlaylist, currentPlaying);
				
				        if (newestSaved > 0) {
				            return newestSaved;
				        }
				        return Date.now();
				    };
				
				    let totalBufferSeconds = 0;
				    const bytesPerSecond = this.state.bitrate / 8;
				
				    if (bytesPerSecond > 0 && !this.state.isStopped) {
				        totalBufferSeconds = this.state.playlistChunks.reduce((acc, c) => acc + (c.length / bytesPerSecond), 0);
				        
				        const player = this.app.player;
				        const currentChunk = this.state.currentPlayingChunkData;
				        
			        if (this.state.isPlaying && currentChunk && player.currentChunkStartTime > 0 && player.audioCtx) {
			            const elapsed = player.audioCtx.currentTime - player.currentChunkStartTime;
			            const remainingInChunk = (currentChunk.length / bytesPerSecond) - elapsed;
			            totalBufferSeconds += Math.max(0, remainingInChunk);
			        } else if (player.currentChunkOffset > 0) {
			            totalBufferSeconds -= player.currentChunkOffset;
			        }
			
				        
				        if (!this.state.isNetworkFrozen && this.app.streamer.chunkProcessor.rawBuffer) {
				            totalBufferSeconds += this.app.streamer.chunkProcessor.rawBuffer.length / bytesPerSecond;
				        }
				    }
				
				    const bufferText = `(${formatBufferDuration(totalBufferSeconds)})`;
				    const timeRange = `${formatTime(getPlaybackTime())} ➔ ${formatTime(getNewestTime())}`;
				
				    let statusText = "";
				    let statusClass = "";
				
				    if (this.state.isLiveMode) {
				        const stationName = this.app.livestations[this.els.liveStationSelect.value]?.name || "";
				        statusText = `Live - ${stationName}`;
				        statusClass = (!this.state.isStopped && !this.state.isNetworkFrozen) ? "status-buffering-active" : "status-live";
				    }
				    else if (!this.state.isStopped) {
				        let mode = 'Rec';
				        
				        if (!this.state.isNetworkFrozen && !this.state.isConnected) {
				            mode = this.state.isPlaying ? 'Play' : 'Try';
				            statusClass = "status-frozen";
				        } else {
				            if (this.state.isPlaying) {
				                mode = 'Play';
				            } else if (this.state.isNetworkFrozen) {
				                mode = 'Stop';
				            }
				            statusClass = this.state.isNetworkFrozen ? "status-buffering-idle" : "status-buffering-active";
				        }
				        
				        statusText = `${mode} - ${timeRange} ${bufferText}`;
				    } 
				    else {
				        const rangeStr = this.state.firstChunkTimestamp ? ` - ${timeRange} ${bufferText}` : "";
				        statusText = `Stop${rangeStr}`;
				        statusClass = "status-frozen";
				    }
				    
				    this.els.statusDisplay.innerText = statusText;
				    this.els.statusDisplay.className = statusClass;
				}
				
			
			    #updateButtons() {
			        const canPlay = this.state.playlistChunks.length >= 1 || this.state.isPlaying || this.state.isManualPause;
			        
			
			        const shouldBeDisabled = this.state.isLiveMode ||
			                                 (!canPlay) ||
			                                 (!this.state.isPlaying && this.state.isDecoding);
			
			        this.els.startBtn.disabled = shouldBeDisabled;
			
			        this.els.startBtn.innerHTML = this.state.isPlaying ? this.icons.pause : this.icons.play;
			        
			        const canControl = !this.state.isLiveMode && !this.state.isStopped && this.state.isPlaying;
			        this.els.rewindBtn.disabled = !canControl || this.state.playedChunksHistory.length < 1;
			        this.els.rewindBtn2.disabled = !canControl || this.state.playedChunksHistory.length < 10;
			        this.els.skipBtn.disabled = !canControl || this.state.playlistChunks.length < 1;
			        this.els.skipBtn2.disabled = !canControl || this.state.playlistChunks.length < 10;
			
			        this.els.liveBtn.disabled = this.state.isPlaying;
			        this.els.liveBtn.classList.toggle('live-active', this.state.isLiveMode);
		            this.els.liveBtn.innerHTML = `<span>LIVE</span> ${this.state.isLiveMode ? this.icons.pause : this.icons.play}`;
		        }
			
			
				#updateControls() {
				    this.els.stationSelect.disabled = this.state.isLiveMode || (!this.state.isStopped && !this.state.isNetworkFrozen);
				    this.els.liveStationSelect.disabled = this.state.isPlaying;
				    this.els.stopSwitch.checked = !this.state.isNetworkFrozen;
				    this.els.stopSwitch.disabled = this.state.isLiveMode;
				    this.els.switchButton.style.transform = this.els.stopSwitch.checked ? 'translateX(100%)' : 'translateX(0)';
				
				    if (this.state.isLiveMode) {
				        this.els.liveBtn.classList.add('btn-active');
				    } else {
				        this.els.liveBtn.classList.remove('btn-active');
				    }

				    if (this.state.isPlaying) {
				        this.els.startBtn.classList.add('btn-active');
				    } else {
				        this.els.startBtn.classList.remove('btn-active');
				    }
				}
				
			
			    
			
			    #updateSleepTimerSlider() {
			        if (!this.state.sleepTimerEndTime) {
			            this.els.sleepTimerSlider.value = 0;
			            this.els.sleepTimerSlider.style.background = `linear-gradient(to right, var(--clr-light) 0%, var(--bg-inactive) 0%)`;
			            return;
			        }
			        const remainingMinutes = Math.ceil((this.state.sleepTimerEndTime - Date.now()) / 60000);
			        const max = parseInt(this.els.sleepTimerSlider.max) || 60;
			        const percentage = (remainingMinutes / max) * 100;
			        this.els.sleepTimerSlider.value = remainingMinutes;
			        this.els.sleepTimerSlider.style.background = `linear-gradient(to right, var(--clr-light) ${percentage}%, var(--bg-inactive) ${percentage}%)`;
			    }
			
			    updateMediaSession(title, artist) {
			    if ('mediaSession' in navigator) {
			        try {
			            navigator.mediaSession.metadata = new MediaMetadata({ title, artist, album: 'Radio Player' });
			            const setHandler = (action, handler) => {
			                try { navigator.mediaSession.setActionHandler(action, handler); } catch (e) {}
			            };
			            setHandler('play', () => this.state.isLiveMode ? this.els.liveAudio.play().catch(()=>{}) : this.app.player.play());
			            setHandler('pause', () => this.state.isLiveMode ? this.els.liveAudio.pause() : this.app.player.pause());
			            setHandler('stop', () => this.state.isLiveMode ? this.stopLiveMode() : this.app.toggleNetworkFreeze());
			        } catch (e) {}
			    }
			}
			
			    getPerceivedGain(linearVolume) {
			        if (linearVolume <= 0) return 0;
			        if (linearVolume >= 1) return 1.0;
			        return Math.min(1.0, Math.pow(linearVolume, 0.35) * (1.2 - 0.2 * linearVolume));
			    }
			    

			
			    
			    
			}
			
			class StreamManager {
			    constructor(app) {
			        this.app = app;
			        this.state = app.state;
			        this.chunkProcessor = new ChunkProcessor(app);
			        this.reader = null;
			        this.controller = null;
			        this.lastConnectTime = 0;
			    }
			    
			    async connect() {
			        if (this.state.isStopped || this.state.isNetworkFrozen || this.state.isConnecting) return;
			        this.lastConnectTime = Date.now();
			        this.disconnect(true);
			        this.controller = new AbortController();
			        this.state.isConnecting = true;
			        this.state.lastDataTime = Date.now();
			
			        const connectTimeoutId = setTimeout(() => {
			            if (this.state.isConnecting && this.controller) {
			                this.controller.abort();
			            }
			        }, 8000);
			
			        try {
			            const url = this.state.streamUrl + (this.state.streamUrl.includes("?") ? "&" : "?") + "t=" + Date.now();
			            const response = await fetch(url, { signal: this.controller.signal, cache: "no-store", mode: "cors" });
			            

			            clearTimeout(connectTimeoutId);
			
			            if (!response.ok) {
			                this.state.isConnecting = false;
			                return;
			            }
			            if (!response.body) {
			                this.state.isConnecting = false;
			                return;
			            }
			
			            this.reader = response.body.getReader();
			            this.state.isConnecting = false;
			            this.state.isConnected = true;
			            this.chunkProcessor.prepareReconnect();
			            await this.#readLoop();
			        } catch (e) {
			            clearTimeout(connectTimeoutId);
			            this.state.isConnected = false;
			            this.state.isConnecting = false;
			            this.reader = null;
			        }
			    }
			
			
			
			    disconnect(forceFlush = false) {
			        if (forceFlush && this.chunkProcessor) {
			            this.chunkProcessor.process(new Uint8Array(0), true);
			        }
			        if (this.controller) { 
			            try { this.controller.abort(); } catch(e) {} 
			        }
			        if (this.reader) { 
			            this.reader.cancel().catch(() => {}); 
			        }
			        this.controller = null;
			        this.reader = null;
			        this.state.isConnected = false;
			        this.state.isConnecting = false;
			    }
			    
			    
			    async #readLoop() {
			        try {
			            while (!this.state.isStopped && !this.state.isNetworkFrozen && this.reader) {
			                const { done, value } = await this.reader.read();
			                if (done) {
			                    break;
			                }
			                await this.chunkProcessor.process(value);
			                this.state.isConnected = true;
			                this.state.lastDataTime = Date.now();
			            }
			        } catch (err) {
			        } finally { 
			            this.disconnect(true); 
			        }
			    }
			    
			    
				ensureConnection() {
				    if (this.state.isStopped || this.state.isNetworkFrozen) return;
				    
				    const stalled = Date.now() - this.state.lastDataTime > 10000;
				    const idle = !this.state.isConnected && !this.state.isConnecting;
				    const cooldownPassed = Date.now() - this.lastConnectTime > 5000;
				    if (stalled && this.state.isConnected) {
				        this.connect();
				    } else if (idle && cooldownPassed) {
				        this.connect();
				    }
				}
			
			}
			
		
			class ChunkProcessor {
			    constructor(app) {
			        this.app = app;
			        this.state = app.state;
			        this.rawBuffer = new Uint8Array(0);
			        this.firstChunkInSession = true;
			        this.isReconnect = false;
			        this.lastChunkTailFrames = [];
			    }
			
			
			    reset() {
			        this.rawBuffer = new Uint8Array(0);
			        this.firstChunkInSession = true;
			        this.isReconnect = false;
			        this.lastChunkTailFrames = [];
			    }
			
			
			    prepareReconnect() {
			        this.rawBuffer = new Uint8Array(0);
			        this.isReconnect = true;
			        this.firstChunkInSession = true;
			    }
			
			
			    #extractTailFrameSignatures(chunkData, count = 8) {
			        const signatures = [];
			        let pos = 0;
			        const frames = [];
			
			        while (pos < chunkData.length) {
			            const size = this.#getFrameSize(chunkData, pos);
			            if (size <= 0 || pos + size > chunkData.length) break;
			            frames.push({ pos, size });
			            pos += size;
			        }
			
			        const tail = frames.slice(-count);
			        for (const f of tail) {
			            const sigLen = Math.min(16, f.size);
			            const sig = chunkData.subarray(f.pos, f.pos + sigLen);
			            signatures.push({ size: f.size, sig: Array.from(sig) });
			        }
			        return signatures;
			    }

				#extractValidChunk(targetMaxBytes) {
				    let currentPos = 0;
				    const validSegments = [];
				    let segmentStart = 0;
				    let accumulatedLength = 0;
				
				    while (currentPos < this.rawBuffer.length && (accumulatedLength + (currentPos - segmentStart)) < targetMaxBytes) {
				        const frameSize = this.#getFrameSize(this.rawBuffer, currentPos);
				        if (frameSize <= 0 || currentPos + frameSize > this.rawBuffer.length) {
				            if (currentPos > segmentStart) {
				                validSegments.push(this.rawBuffer.subarray(segmentStart, currentPos));
				                accumulatedLength += (currentPos - segmentStart);
				            }
				            if (frameSize <= 0) {
				                const nextSync = this.#findFirstValidHeaderChain(this.rawBuffer, currentPos + 1);
				                if (nextSync !== -1) { 
				                    currentPos = nextSync; 
				                    segmentStart = nextSync;
				                    continue; 
				                } else {
				                    segmentStart = this.rawBuffer.length;
				                    currentPos = this.rawBuffer.length;
				                    break;
				                }
				            } else {
				                segmentStart = currentPos;
				                break;
				            }
				        }
				
				        if ((accumulatedLength + (currentPos - segmentStart) + frameSize) > targetMaxBytes) {
				            break;
				        }
				        currentPos += frameSize;
				    }
				
				    if (currentPos > segmentStart) {
				        validSegments.push(this.rawBuffer.subarray(segmentStart, currentPos));
				        accumulatedLength += (currentPos - segmentStart);
				    }
				
				    if (accumulatedLength > 0) {
				        const chunkData = new Uint8Array(accumulatedLength);
				        let offset = 0;
				        for (let i = 0; i < validSegments.length; i++) {
				            chunkData.set(validSegments[i], offset);
				            offset += validSegments[i].length;
				        }
				        this.rawBuffer = this.rawBuffer.slice(currentPos);
				        return chunkData;
				    }
				    return null;
				}

			
			
			    #findOverlapOffset(buffer) {
			        if (!this.lastChunkTailFrames || this.lastChunkTailFrames.length === 0) return -1;
			
			        const targetFrame = this.lastChunkTailFrames[this.lastChunkTailFrames.length - 1];
			        const targetSig = targetFrame.sig;
			
			        for (let i = 0; i < buffer.length - targetSig.length; i++) {
			            if (buffer[i] === targetSig[0] && buffer[i + 1] === targetSig[1]) {
			                let match = true;
			                for (let j = 0; j < targetSig.length; j++) {
			                    if (buffer[i + j] !== targetSig[j]) {
			                        match = false;
			                        break;
			                    }
			                }
			                if (match) {
			                    return i + targetFrame.size;
			                }
			            }
			        }
			        return -1;
			    }
			
			
			    async #storeChunk(chunkData) {
			        if (!chunkData || chunkData.length === 0) {
			            return;
			        }
			
			        if (!this.state.firstChunkTimestamp) {
			            this.state.firstChunkTimestamp = Date.now();
			        }
			
			        const isValid = this.#isValidAudioChunk(chunkData);
			
			        if (!isValid) {
			            return;
			        }
			
			        this.lastChunkTailFrames = this.#extractTailFrameSignatures(chunkData);
			        const chunkId = `c_${Date.now()}_${chunkData.length}_${Math.random().toString(36).substr(2, 5)}`;
			        
			        try {
			            await this.app.chunkDB.set(chunkId, chunkData);
			            this.state.playlistChunks.push({
			                id: chunkId,
			                length: chunkData.length,
			                startTime: Date.now()
			            });
			        } catch (e) {
			        }
			    }
			
			
			    #getFrameSize(data, pos) {
			        if (pos + 4 > data.length) return -1;
			        if (data[pos] !== 0xFF || (data[pos + 1] & 0xE0) !== 0xE0) return -1;
			
			        const mpegVersion = (data[pos + 1] & 0x18) >> 3;
			        const layer = (data[pos + 1] & 0x06) >> 1;
			        
			        if (mpegVersion === 1 || layer !== 1) return -1;
			
			        const bitrateIdx = (data[pos + 2] & 0xF0) >> 4;
			        const sampleRateIdx = (data[pos + 2] & 0x0C) >> 2;
			        const padding = (data[pos + 2] & 0x02) >> 1;
			
			        if (bitrateIdx === 0 || bitrateIdx === 15 || sampleRateIdx === 3) return -1;
			
			        const bitratesMPEG1 = [0, 32, 40, 48, 56, 64, 80, 96, 112, 128, 160, 192, 224, 256, 320, 0];
			        const bitratesMPEG2 = [0, 8, 16, 24, 32, 40, 48, 56, 64, 80, 96, 112, 128, 144, 160, 0];
			        
			        const sampleRatesMPEG1 = [44100, 48000, 32000];
			        const sampleRatesMPEG2 = [22050, 24000, 16000];
			        const sampleRatesMPEG25 = [11025, 12000, 8000];
			
			        let bitrate = (mpegVersion === 3) ? bitratesMPEG1[bitrateIdx] * 1000 : bitratesMPEG2[bitrateIdx] * 1000;
			        
			        let sampleRate;
			        if (mpegVersion === 3) {
			            sampleRate = sampleRatesMPEG1[sampleRateIdx];
			        } else if (mpegVersion === 2) {
			            sampleRate = sampleRatesMPEG2[sampleRateIdx];
			        } else if (mpegVersion === 0) {
			            sampleRate = sampleRatesMPEG25[sampleRateIdx];
			        } else {
			            return -1;
			        }
			
			        if (!bitrate || !sampleRate) return -1;
			
			        const coefficients = (mpegVersion === 3) ? 144 : 72;
			        return Math.floor((coefficients * bitrate) / sampleRate) + padding;
			    }
			
			
			    #findFirstValidHeaderChain(data, offset, requiredChainLength = 3) {
			        for (let i = offset; i < data.length - 4; i++) {
			            if (data[i] === 0xFF && (data[i + 1] & 0xE0) === 0xE0) {
			                let currentPos = i;
			                let validChain = 0;
			
			                while (currentPos < data.length && validChain < requiredChainLength) {
			                    let frameSize = this.#getFrameSize(data, currentPos);
			                    if (frameSize <= 0) break;
			                    
			                    currentPos += frameSize;
			                    validChain++;
			                }
			
			                if (validChain >= requiredChainLength) {
			                    return i;
			                }
			            }
			        }
			        return -1;
			    }
			

				process(newData, forceFlush = false) {
				    if (newData && newData.length > 0) {
				        if (this.rawBuffer.length === 0) {
				            this.rawBuffer = newData;
				        } else {
				            const combined = new Uint8Array(this.rawBuffer.length + newData.length);
				            combined.set(this.rawBuffer);
				            combined.set(newData, this.rawBuffer.length);
				            this.rawBuffer = combined;
				        }
				    }
				    
				    if (this.firstChunkInSession && this.rawBuffer.length > 4) {
				        const startPos = this.#findFirstValidHeaderChain(this.rawBuffer, 0);
				        if (startPos !== -1 && startPos + 3 < this.rawBuffer.length) {
				            const mpegVersion = (this.rawBuffer[startPos + 1] & 0x18) >> 3;
				            const bitrateIdx = (this.rawBuffer[startPos + 2] & 0xF0) >> 4;
				
				            const bitratesMPEG1 = [0, 32, 40, 48, 56, 64, 80, 96, 112, 128, 160, 192, 224, 256, 320, 0];
				            const bitratesMPEG2 = [0, 8, 16, 24, 32, 40, 48, 56, 64, 80, 96, 112, 128, 144, 160, 0];
				
				            const detectedBitrate = (mpegVersion === 3) ? bitratesMPEG1[bitrateIdx] * 1000 : bitratesMPEG2[bitrateIdx] * 1000;
				
				            if (detectedBitrate > 0 && detectedBitrate !== this.state.bitrate) {
				                this.state.bitrate = detectedBitrate;
				                this.app.chunkDB.setSetting("lastDetectedBitrate", detectedBitrate);
				            }
				        }
				    }        
				
				    if (this.isReconnect && this.rawBuffer.length > 0) {
				        const overlapOffset = this.#findOverlapOffset(this.rawBuffer);
				        if (overlapOffset !== -1) {
				            this.rawBuffer = this.rawBuffer.slice(overlapOffset);
				        }
				        this.isReconnect = false;
				    }
				    
				    const bytesPerChunk = (this.state.bitrate / 8) * 60;
				    const safeBufferSize = bytesPerChunk + 65536;
				
				    while (this.rawBuffer.length >= safeBufferSize) {
				        const startPos = this.firstChunkInSession ? this.#findFirstValidHeaderChain(this.rawBuffer, 0) : 0;
				        
				        if (startPos === -1) { 
				            this.rawBuffer = new Uint8Array(0); 
				            break; 
				        }
				        if (startPos > 0) {
				            this.rawBuffer = this.rawBuffer.slice(startPos);
				        }
				        this.firstChunkInSession = false;
				        
				        const chunkData = this.#extractValidChunk(bytesPerChunk);
				        if (chunkData) {
				            this.#storeChunk(chunkData);
				        } else {
				            if (this.rawBuffer.length >= safeBufferSize) {
				                this.rawBuffer = this.rawBuffer.slice(safeBufferSize);
				            }
				            break;
				        }
				    }
				
				    if (forceFlush && this.rawBuffer.length > 0) {
				        const chunkData = this.#extractValidChunk(this.rawBuffer.length);
				        if (chunkData) {
				            this.#storeChunk(chunkData);
				        }
				        this.rawBuffer = new Uint8Array(0);
				    }
				}


			
			
			    #isValidAudioChunk(data) {
			        if (!data || data.length < 100) return false;
			        let pos = 0;
			        while (pos < data.length) {
			            let frameSize = this.#getFrameSize(data, pos);
			            if (frameSize <= 0 || pos + frameSize > data.length) {
			                return false;
			            }
			            pos += frameSize;
			        }
			        return pos === data.length;
			    }
			
			}
		

			class Player {
			    
			    constructor(app) {
			        this.app = app;
			        this.state = app.state;
			        this.audioCtx = null;
			        this.gainNode = null;
			        this.activeSources = new Set();
			        this.playbackTimeoutId = null;
			        this.virtualPlayTime = 0;
			        this.currentChunkStartTime = 0;
			        this.isRebuffering = false;
			        this.currentChunkOffset = 0;
			        this.jumpGeneration = 0;
			        
			        this.decodedCache = new Map();
                    this.MAX_DECODED_CACHE = 3;
			        
			        this.lastGainNode = null;
                    this.FADE_TIME = 0.05;
			    }

				async #getOrDecodeChunk(chunkId) {
				    if (!chunkId || !this.audioCtx) return null;
				    if (this.decodedCache.has(chunkId)) {
				        const cached = this.decodedCache.get(chunkId);
				        this.decodedCache.delete(chunkId);
				        this.decodedCache.set(chunkId, cached);
				        return cached;
				    }
				
					const decodePromise = (async () => {
					    try {
					        const rawData = await this.app.chunkDB.get(chunkId);
					        if (!rawData) return null;
					        return await this.audioCtx.decodeAudioData(rawData.buffer);
					    } catch (e) {
					        this.decodedCache.delete(chunkId);
					        return null;
					    }
					})();

				    if (this.decodedCache.size >= this.MAX_DECODED_CACHE) {
				        const oldestKey = this.decodedCache.keys().next().value;
				        this.decodedCache.delete(oldestKey);
				    }
				    this.decodedCache.set(chunkId, decodePromise);
				
				    return decodePromise;
				}
				

			    #preloadNeighbors() {

			        if (this.state.playlistChunks.length > 0) {
			            const nextId = this.state.playlistChunks[0].id;
			            if (!this.decodedCache.has(nextId)) {
			                this.#getOrDecodeChunk(nextId);
			            }
			        }

			        if (this.state.playedChunksHistory.length > 0) {
			            const prevId = this.state.playedChunksHistory[this.state.playedChunksHistory.length - 1].id;
			            if (!this.decodedCache.has(prevId)) {
			                this.#getOrDecodeChunk(prevId);
			            }
			        }
			    }

			
                async initAudioContext() {
			        if (!this.audioCtx || this.audioCtx.state === 'closed') {
			            const AudioContextClass = window.AudioContext || window.webkitAudioContext;
			            if (!AudioContextClass) {
			                return;
			            }
			            this.audioCtx = new AudioContextClass();

			            this.gainNode = this.audioCtx.createGain();
			            const initialGain = this.app.ui.getPerceivedGain(this.app.ui.els.volumeSlider.value / 100);
			            this.gainNode.gain.setValueAtTime(initialGain, this.audioCtx.currentTime);
			            this.gainNode.connect(this.audioCtx.destination);

			            this.audioCtx.onstatechange = () => {
			                if ((this.audioCtx.state === 'suspended' || this.audioCtx.state === 'interrupted') && this.state.isPlaying) {
			                    this.audioCtx.resume().catch(() => {});
			                }
			            };
			        }

			        if (this.audioCtx.state === "suspended") {
			            try {
			                await this.audioCtx.resume();
			            } catch (err) {}
			        }
			    }


				async jumpChunks(amount) {
				        if (this.state.isStopped || this.isJumping) return;
				
				        this.isJumping = true;
				        const wasPlaying = this.state.isPlaying;
				
				        let preservedOffset = 0;
				        if (this.state.currentPlayingChunkData && this.currentChunkStartTime > 0 && this.audioCtx) {
				            preservedOffset = Math.max(0, this.audioCtx.currentTime - this.currentChunkStartTime) + this.currentChunkOffset;
				        } else {
				            preservedOffset = this.currentChunkOffset;
				        }
				
				        this.resetScheduledPlayback();
				        this.currentChunkOffset = preservedOffset;
				
				
				        if (this.state.currentPlayingChunkData) {
				            this.state.playlistChunks.unshift(this.state.currentPlayingChunkData);
				            this.state.currentPlayingChunkData = null;
				        }
				
				        if (amount > 0) {
				            const toSkip = Math.min(amount, this.state.playlistChunks.length);
				            for (let i = 0; i < toSkip; i++) {
				                if (this.state.playlistChunks.length > 0) {
				                    this.state.playedChunksHistory.push(this.state.playlistChunks.shift());
				                }
				            }
				        } else {
				
				            const toRewind = Math.min(Math.abs(amount), this.state.playedChunksHistory.length);
				            for (let i = 0; i < toRewind; i++) {
				                if (this.state.playedChunksHistory.length > 0) {
				                    this.state.playlistChunks.unshift(this.state.playedChunksHistory.pop());
				                }
				            }
				        }
				
				        if (wasPlaying) {
				            await this.#playbackLoop();
				        }
				        
				        this.isJumping = false;
				        this.app.ui.update();
				    }


                async play() {
			        await this.initAudioContext();
			        if (!this.audioCtx) return;

			        if (this.audioCtx.state === "suspended") {
			            try {
			                await this.audioCtx.resume();
			            } catch (err) {}
			        }

			        const finalGain = this.app.ui.getPerceivedGain(this.app.ui.els.volumeSlider.value / 100);
			        if (this.gainNode) {
			            this.gainNode.gain.setValueAtTime(finalGain, this.audioCtx.currentTime);
			        }

			        this.state.isManualPause = false;
			        this.state.isPlaying = true;
			        this.isRebuffering = false;

			        if (!this.state.hasStartedPlayback) {
			            this.virtualPlayTime = this.audioCtx.currentTime;
			        }

			        this.app.requestWakeLock();
			        this.#playbackLoop();

			        const selectedStation = this.app.stations[this.app.ui.els.stationSelect.value];
			        if (selectedStation) {
			            this.app.ui.updateMediaSession(selectedStation.name, "Timeshift Live Buffer");
			        }
			    }			    

			
			    pause(isManualAction = true) {
				    if (isManualAction) {
				        this.state.isManualPause = true;
				        this.state.isPlaying = false;
				        this.isRebuffering = false;
				    }
				    if (this.state.currentPlayingChunkData && this.currentChunkStartTime > 0 && this.audioCtx) {
				        const elapsed = Math.max(0, this.audioCtx.currentTime - this.currentChunkStartTime);
				        this.currentChunkOffset += elapsed;
				        this.app.chunkDB.setSetting("lastPlayingChunkOffset", this.currentChunkOffset);
				        
				        this.state.playlistChunks.unshift(this.state.currentPlayingChunkData);
				        this.state.currentPlayingChunkData = null;
				    }
			
			
				    this.resetScheduledPlayback();
				   
				    if (this.state.wakeLock) { 
				        this.state.wakeLock.release().catch(() => {}); 
				        this.state.wakeLock = null; 
				    }
				    if ('mediaSession' in navigator) navigator.mediaSession.playbackState = "paused";
				}
			
			
			    async #playbackLoop() {
			        if (!this.state.isPlaying || this.state.isStopped || !this.audioCtx) {
			            return;
			        }
			
			        const currentGeneration = this.jumpGeneration;
			        const now = this.audioCtx.currentTime;
			
			        if (this.virtualPlayTime < now) {
			            this.virtualPlayTime = now + 0.05;
			        }
			
			        const scheduleAheadTime = 10.0;
			        if ((this.virtualPlayTime - now) > scheduleAheadTime || this.state.isDecoding) {
			            if (currentGeneration === this.jumpGeneration) {
			                this.playbackTimeoutId = setTimeout(() => this.#playbackLoop(), 100);
			            }
			            return;
			        }
			
			        if (this.isRebuffering) {
			            if (this.state.playlistChunks.length >= 2 || !this.state.isConnected) {
			                this.isRebuffering = false;
			            } else {
			                if (currentGeneration === this.jumpGeneration) {
			                    this.playbackTimeoutId = setTimeout(() => this.#playbackLoop(), 200);
			                }
			                return;
			            }
			        }
			
			        if (this.state.playlistChunks.length === 0) {
			            if (now >= this.virtualPlayTime) {
			                this.isRebuffering = true;
			            }
			            if (currentGeneration === this.jumpGeneration) {
			                this.playbackTimeoutId = setTimeout(() => this.#playbackLoop(), 250);
			            }
			            return;
			        }
			
			        this.state.isDecoding = true;
			        const chunkEntry = this.state.playlistChunks.shift();
			
			        try {

			            const audioBuffer = await this.#getOrDecodeChunk(chunkEntry.id);
			

			            if (currentGeneration !== this.jumpGeneration) {
			                return;
			            }
			
			            if (!audioBuffer) {
			                return;
			            }
			
			            if (!this.state.isPlaying) {
			                this.state.playlistChunks.unshift(chunkEntry);
			                return;
			            }
			
			            if (this.state.currentPlayingChunkData) {
			                this.state.playedChunksHistory.push(this.state.currentPlayingChunkData);
			            }
			            this.state.currentPlayingChunkData = chunkEntry;
			            this.state.hasStartedPlayback = true;
			
			            await this.app.chunkDB.setSetting("lastPlayingChunkId", chunkEntry.id);
			            await this.app.chunkDB.setSetting("lastPlayingChunkOffset", 0);
			

			            this.#scheduleChunk(audioBuffer);
			

                        this.#preloadNeighbors();
			        } catch (e) {
			        } finally {
			            this.state.isDecoding = false;
			            if (currentGeneration === this.jumpGeneration) {
			                this.playbackTimeoutId = setTimeout(() => this.#playbackLoop(), 10);
			            }
			        }
			    }
			

			    resetScheduledPlayback() {
			        this.jumpGeneration++;
			        this.virtualPlayTime = 0;
			        this.currentChunkStartTime = 0;
			        this.lastGainNode = null; 
			    
			        if (!this.state.isManualPause) {
			            this.currentChunkOffset = 0;
			        }
			        if (this.playbackTimeoutId) clearTimeout(this.playbackTimeoutId);
			        
			        const now = this.audioCtx ? this.audioCtx.currentTime : 0;
			        this.activeSources.forEach(item => {
			            try {
			                const { source, gainNode } = item;
			                gainNode.gain.cancelScheduledValues(now);
			                gainNode.gain.setValueAtTime(gainNode.gain.value, now);
			                gainNode.gain.exponentialRampToValueAtTime(0.0001, now + 0.03); 
			                source.stop(now + 0.03);
			            } catch (e) {
			                try { item.stop(0); item.disconnect(); } catch(err){}
			            }
			        });
			        this.activeSources.clear();
			    }
				

			    #scheduleChunk(buffer) {
			        const source = this.audioCtx.createBufferSource();
			        source.buffer = buffer;
			
			        const localGain = this.audioCtx.createGain();
			        source.connect(localGain);
			        localGain.connect(this.gainNode);
			
			        const now = this.audioCtx.currentTime;
			        const offset = Math.max(0, Math.min(this.currentChunkOffset, buffer.duration - 0.1));
			        const duration = buffer.duration - offset;
			        this.currentChunkOffset = 0;
			
			        const isSeamless = (this.virtualPlayTime > now && this.lastGainNode !== null);
			        const fadeDuration = this.FADE_TIME;
			
			        let startTime = Math.max(now, this.virtualPlayTime);
			        if (isSeamless) {
			            startTime = Math.max(now, this.virtualPlayTime - fadeDuration);
			        }
			
			        if (isSeamless) {
			            const prevGain = this.lastGainNode;
			            try {

			                prevGain.gain.cancelScheduledValues(startTime);
			                prevGain.gain.setValueAtTime(1.0, startTime);
			                prevGain.gain.linearRampToValueAtTime(0.0, startTime + fadeDuration);
			            } catch (e) {}
			

			            localGain.gain.setValueAtTime(0.0, startTime);
			            localGain.gain.linearRampToValueAtTime(1.0, startTime + fadeDuration);
			        } else {

			            localGain.gain.setValueAtTime(0.0, startTime);
			            localGain.gain.linearRampToValueAtTime(1.0, startTime + 0.01);
			        }
			
			        source.start(startTime, offset);
			
			        this.currentChunkStartTime = startTime - offset;
			        this.virtualPlayTime = startTime + duration;
			        this.lastGainNode = localGain;
			
			        const item = { source, gainNode: localGain };
			        this.activeSources.add(item);
			
			        source.onended = () => {
			            if (this.lastGainNode === localGain) {
			                this.lastGainNode = null;
			            }
			            this.activeSources.delete(item);
			            try { 
			                source.disconnect(); 
			                localGain.disconnect(); 
			            } catch (e) {}
			        };
			    }
			
			}
			
			new App();
	    
	</script>
