<style>

:root {
    --bg-main: #0e0e0e;
    --bg-card: #1a1a1a;
    --bg-input: #282828;
    --bg-reload: #4a4a4a;

    --text-light: #ffffff;
    --text-muted: #a0a0ab;
    --text-disabled: #b0b0b0; 
    --text-select-disabled: #c5c5c5;

    --clr-cyan: #52c5c5;
    --clr-green: #4fca75; 
    --clr-grey: #e0e0e0;
    --clr-grey-buffering: #4a4a4a;

    --clr-slider: #e0e0e0;
}


body { 
    font-family: sans-serif;
    background: var(--bg-main); 
    color: var(--text-light); 
    display: flex;
    flex-direction: column; 
    align-items: center; 
    justify-content: center; 
    min-height: 100dvh; 
    margin: 0; 
    padding-top: max(1rem, env(safe-area-inset-top));
    padding-bottom: max(1rem, env(safe-area-inset-bottom));
    padding-left: env(safe-area-inset-left);
    padding-right: env(safe-area-inset-right);
    box-sizing: border-box;
}

.player-card, 
.player-card *, 
.player-card *::before, 
.player-card *::after {
    box-sizing: border-box;
}

.player-card { 
    position: relative;
    background: var(--bg-card); 
    padding: 2rem 1.5rem; 
    border-radius: 24px; 
    width: 92%; 
    max-width: 400px;
    text-align: center;
    border: 3px solid var(--clr-cyan); 
    box-shadow: 0 12px 32px rgba(0, 188, 212, 0.15), 0 4px 12px rgba(0,0,0,0.6);
    margin: 20px auto;
}

.player-card h1, 
.player-card .control-container {
    margin-top: 20px;
}

.control-container { 
    margin-bottom: 1.5rem; 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    gap: 0.5rem;
}


.station-select { 
    width: 100%; 
    max-width: 280px; 
    padding: 0.45rem 2.5rem 0.45rem 1.5rem; 
    background: var(--bg-input); 
    color: var(--text-light);
    border: 2px solid var(--clr-cyan); 
    border-radius: 50px; 
    font-size: 1rem;        
    font-weight: bold; 
    outline: none; 
    cursor: pointer; 
    text-align: center; 
    text-align-last: center;
    appearance: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%2300bcd4' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'></polyline></svg>");
    background-repeat: no-repeat;
    background-position: right 1.2rem center;
    height: 40px;
    line-height: normal;
}

.station-select.live-select {
    border-color: var(--clr-green);
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%232e7d32' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'></polyline></svg>");
}

.station-select option {
    background: var(--bg-input);
    color: var(--text-light);
    font-weight: normal;
}


.slider-input, 
.timer-input {
    appearance: none;
    width: 100%;
    height: 10px;
    border-radius: 6px;
    outline: none;
    cursor: pointer;
}

.slider-input { 
    background: linear-gradient(to right, var(--clr-slider) 0%, var(--clr-slider) 50%, #444 50%, #444 100%);
}

.timer-input { 
    background: linear-gradient(to right, var(--clr-slider) 0%, var(--clr-slider) 0%, #444 0%, #444 100%);
}


.slider-input::-webkit-slider-thumb,
.timer-input::-webkit-slider-thumb { 
    appearance: none; 
    width: 20px; 
    height: 20px; 
    border-radius: 50%;
    background: var(--clr-slider);
    cursor: pointer;
    box-shadow: 0 0 10px rgba(255, 152, 0, 0.5), 0 2px 4px rgba(0,0,0,0.4);
}

.slider-input::-moz-range-thumb,
.timer-input::-moz-range-thumb { 
    width: 20px; 
    height: 20px; 
    border: none; 
    border-radius: 50%;
    background: var(--clr-slider);
    cursor: pointer;
    box-shadow: 0 0 10px rgba(255, 152, 0, 0.5), 0 2px 4px rgba(0,0,0,0.4);
}


.btn, 
#liveBtn { 
    background: transparent;
    padding: 0 1rem;       
    border-radius: 50px; 
    cursor: pointer; 
    width: 100%;
    max-width: 280px;
    margin: 0.4rem auto;       
    display: flex;
    align-items: center;
    justify-content: center;
    outline: none;
    font-size: 0.95rem;           
    font-weight: bold;
    height: 40px;
    line-height: 40px;
}

.btn svg {
    width: 18px;                
    height: 18px;                
    stroke: currentColor;
    fill: currentColor;
    display: block;
}


#startBtn { 
    border: 3px solid var(--clr-cyan); 
    color: var(--clr-cyan); 
}

#startBtn.buffering-mode { 
    border-color: var(--clr-grey-buffering); 
    color: var(--clr-grey-buffering); 
}


#liveBtn {
    border: 3px solid var(--clr-green);
    color: var(--text-light);
    letter-spacing: 1px;
}

#liveBtn.live-active {
    border-color: var(--clr-green);
    color: var(--text-light);
}


.split-btn-container {
    display: flex;
    width: 100%;
    max-width: 280px;
    margin: 0.3rem auto;        
    gap: 8px;
}

.split-btn-container .btn {
    margin: 0;
    max-width: none;
    flex: 1;
    border: 3px solid var(--clr-cyan);
    color: var(--clr-cyan);
}

#rewindBtn, #rewindBtn2 { border-radius: 50px 0 0 50px; }
#skipBtn, #skipBtn2     { border-radius: 0 50px 50px 0; }




input:disabled, 
select:disabled,
.btn:disabled {
    opacity: 0.45 !important;
    color: var(--text-disabled) !important;
    border-color: var(--text-disabled) !important;
    cursor: not-allowed;
}

.station-select:disabled { 
    background-color: var(--bg-card);
    color: var(--text-select-disabled) !important;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%23b0b0b0' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'></polyline></svg>") !important;
}


#statusDisplay { 
    font-size: 1rem;
    color: var(--clr-cyan); 
    font-weight: bold;
    min-height: 1.4rem; 
    margin-bottom: 1rem; 
    display: block;
}

#statusDisplay.status-buffering-active { color: var(--clr-cyan); }
#statusDisplay.status-frozen,
#statusDisplay.status-buffering-idle   { color: var(--clr-grey); }
#statusDisplay.status-live             { color: var(--clr-grey); }


.volume-container, 
.buffer-row-container, 
.timer-container {
    display: flex; 
    flex-direction: row; 
    align-items: center;
    gap: 0.8rem;
    width: 100%;
    max-width: 280px;
    margin: 1.2rem auto;
}

.volume-container { margin-top: 1.8rem; }
.timer-container  { margin-top: 1rem; }

.buffer-row-container {
    gap: 8px;
    margin-top: 1.2rem;
}

.split-buffer-wrapper {
    display: flex;
    align-items: center;
    gap: 6px; 
    flex-grow: 1;
    width: 100%;
}

.buffer-container,
.split-buffer-wrapper .buffer-container {
    flex: 1;
    height: 10px; 
    background-color: rgba(255, 255, 255, 0.1);
    border-radius: 4px;
    overflow: hidden;
    position: relative;
    width: 100%;
}

#rewind-bar-fg,
#buffer-bar-fg {
    height: 100%;
    width: 0%;
    position: absolute;
    top: 0;
    transition: width 0.3s ease;
}

#rewind-bar-fg { right: 0; }
#buffer-bar-fg { left: 0; }

.actively-buffering { background-color: var(--clr-cyan); } 
.buffer-underrun    { background-color: var(--clr-grey); }

@keyframes spin {
    to { transform: rotate(360deg); }
}
.spin { animation: spin 1.2s linear infinite; }


.switch-container {
    display: flex;
    position: relative;
    user-select: none;
    width: 100%;
    max-width: 280px;
    margin: 0.4rem auto;
    box-sizing: border-box;
    touch-action: pan-y;
}

.switch-checkbox {
    display: none !important;
}

.switch-label {
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: grab;
    width: 100%;
    height: 40px;
    background: transparent;
    border: 3px solid var(--clr-cyan);
    border-radius: 50px;
    position: relative;
    padding: 0;
    box-sizing: border-box;
}

.switch-text {
    font-size: 0.95rem;
    z-index: 2;
    width: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
}


.switch-text-left {
    color: var(--clr-grey);
}


.switch-text-right {
    color: var(--clr-cyan);
}

.switch-button {
    position: absolute;
    top: 3px;
    left: 3px;
    bottom: 3px;
    width: calc(50% - 3px);
    background-color: var(--bg-input);
    border: 2px solid var(--clr-cyan);
    border-radius: 50px;
    transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1), border-color 0.2s ease-in-out;
    z-index: 1;
    box-sizing: border-box;
    cursor: grabbing;
    pointer-events: auto;
}


.switch-checkbox:not(:checked) + .switch-label .switch-button {
    transform: translateX(0);
    border-color: var(--clr-grey);
    background-color: var(--bg-input);
}


.switch-checkbox:checked + .switch-label .switch-button {
    transform: translateX(100%);
    border-color: var(--clr-cyan);
    background-color: var(--bg-input);
}


.switch-checkbox:disabled + .switch-label {
    opacity: 0.45 !important;
    background: var(--bg-card) !important;
    border-color: var(--text-disabled, #b0b0b0) !important;
    cursor: not-allowed;
}

.switch-checkbox:disabled + .switch-label .switch-text-left,
.switch-checkbox:disabled + .switch-label .switch-text-right {
    color: var(--text-disabled, #b0b0b0) !important;
}

.switch-checkbox:disabled + .switch-label .switch-button {
    background-color: transparent !important;
    border-color: var(--text-disabled, #b0b0b0) !important;
}

.switch-checkbox:checked:disabled + .switch-label .switch-button {
    background-color: var(--bg-input) !important;
    border: 2px solid var(--text-disabled, #b0b0b0) !important;
}
    
    
    
    
</style>

<script>
    
class ChunkDB {
    constructor() {
        this.dbName = "RadioBufferDB";
        this.storeName = "chunks";
        this.settingsStoreName = "settings";
        this.db = null;
    }

    init() {
        return new Promise((resolve, reject) => {
            const request = indexedDB.open(this.dbName, 2);

            request.onupgradeneeded = (e) => {
                const db = e.target.result;
                if (!db.objectStoreNames.contains(this.storeName)) {
                    db.createObjectStore(this.storeName);
                }
                if (!db.objectStoreNames.contains(this.settingsStoreName)) {
                    db.createObjectStore(this.settingsStoreName);
                }
            };

            request.onsuccess = (e) => {
                this.db = e.target.result;
                this.db.onversionchange = () => {
                    this.db.close();
                };
                resolve();
            };

            request.onerror = (e) => reject(e.target.error);
        });
    }

    setSetting(key, value) {
        return new Promise((resolve, reject) => {
            const tx = this.db.transaction(this.settingsStoreName, "readwrite");
            const store = tx.objectStore(this.settingsStoreName);
            const request = store.put(value, key);
            request.onsuccess = () => resolve();
            request.onerror = () => reject(request.error);
        });
    }

    getSetting(key) {
        return new Promise((resolve) => {
            if (!this.db || !this.db.objectStoreNames.contains(this.settingsStoreName)) {
                return resolve(null);
            }
            try {
                const tx = this.db.transaction(this.settingsStoreName, "readonly");
                const store = tx.objectStore(this.settingsStoreName);
                const request = store.get(key);
                request.onsuccess = () => resolve(request.result !== undefined ? request.result : null);
                request.onerror = () => resolve(null);
            } catch (e) {
                resolve(null);
            }
        });
    }
   
    set(id, uint8Data) {
        return new Promise((resolve, reject) => {
            const tx = this.db.transaction(this.storeName, "readwrite");
            const store = tx.objectStore(this.storeName);
            const request = store.put(uint8Data, id);
            request.onsuccess = () => resolve();
            request.onerror = () => reject(request.error);
        });
    }

    get(id) {
        return new Promise((resolve, reject) => {
            const tx = this.db.transaction(this.storeName, "readonly");
            const store = tx.objectStore(this.storeName);
            const request = store.get(id);
            request.onsuccess = () => resolve(request.result);
            request.onerror = () => reject(request.error);
        });
    }
    
    clearAll() {
        return new Promise((resolve, reject) => {
            if (!this.db) return resolve();
            
            const tx = this.db.transaction([this.storeName, this.settingsStoreName], "readwrite");
            
            const chunksStore = tx.objectStore(this.storeName);
            const settingsStore = tx.objectStore(this.settingsStoreName);
            
            chunksStore.clear();
            settingsStore.clear();

            tx.oncomplete = () => {
                resolve();
            };

            tx.onerror = (e) => {
                reject(tx.error || e.target.error);
            };
            
            tx.onabort = (e) => {
                reject(new Error("Transaction aborted"));
            };
        });
    }
    
    getAllKeys() {
        return new Promise((resolve, reject) => {
            if (!this.db) return resolve([]);
            const tx = this.db.transaction(this.storeName, "readonly");
            const store = tx.objectStore(this.storeName);
            const request = store.getAllKeys();
            request.onsuccess = () => resolve(request.result);
            request.onerror = () => reject(request.error);
        });
    }
}

        this.chunkDB = new ChunkDB();
        
        this.livestations = [

    getLiveUrl() {
        const minute = new Date().getMinutes();
        if (minute >= 3 && minute < 27) return this.dynamicUrls.t1;
        if (minute >= 27 && minute < 33) return this.dynamicUrls.t2;
        if (minute >= 33 && minute < 57) return this.dynamicUrls.t1;
        return this.dynamicUrls.t2;
    }

    getLiveUrl2() {
        const minute = new Date().getMinutes();
        if (minute >= 3 && minute < 27) return this.dynamicUrls.t3;
        if (minute >= 27 && minute < 33) return this.dynamicUrls.t4;
        if (minute >= 33 && minute < 57) return this.dynamicUrls.t3;
        return this.dynamicUrls.t4;
    }
    
    startWatchdog() {
    if (this.state.watchdogIntervalId) clearInterval(this.state.watchdogIntervalId);
    this.ui.update();
    this.state.watchdogIntervalId = setInterval(() => {
        this.handleSleepTimer();
        this.streamer.ensureConnection();
        this.ui.update();
    }, 1000);


}

    
    handleSleepTimer() {
        if (!this.state.sleepTimerEndTime) return;
        
        const remainingTime = this.state.sleepTimerEndTime - Date.now();
        if (remainingTime <= 0) {
            this.state.sleepTimerEndTime = null;
            if (this.state.isLiveMode) this.ui.stopLiveMode();
            if (this.state.isPlaying) this.player.pause();
            this.player.resetScheduledPlayback();
        }
    }
    

handleDynamicLiveStream(isInitialCall = false) {
    if (!this.state.isLiveMode) {
        return;
    }

    const switchMinutes = [3, 27, 33, 57];
    const now = new Date();
    const currentMinute = now.getMinutes();
    let nextSwitchMinute = -1;

    for (const minute of switchMinutes) {
        if (currentMinute < minute) {
            nextSwitchMinute = minute;
            break;
        }
    }
    
    if (nextSwitchMinute === -1) {
        nextSwitchMinute = switchMinutes[0];
    }

    const nextSwitchDate = new Date();
    if (nextSwitchMinute <= currentMinute) {
        nextSwitchDate.setHours(now.getHours() + 1);
    }
    nextSwitchDate.setMinutes(nextSwitchMinute, 0, 0);

    const delay = nextSwitchDate.getTime() - now.getTime();

   
    if (isInitialCall) {
        const selected = this.livestations[this.ui.els.liveStationSelect.value];
        if (selected?.url === "dynamic") {
            this.ui.switchLiveStreamTo(this.getLiveUrl());
        } else if (selected?.url === "dynamic_aac") {
            this.ui.switchLiveStreamTo(this.getLiveUrl2());
        }
    }
    

    this.dynamicStreamTimeout = setTimeout(() => {
        if (this.state.isLiveMode && !this.ui.isLiveSwitching) {
            const selected = this.livestations[this.ui.els.liveStationSelect.value];
            if (selected?.url === "dynamic") {
                this.ui.switchLiveStreamTo(this.getLiveUrl());
            } else if (selected?.url === "dynamic_aac") {
                this.ui.switchLiveStreamTo(this.getLiveUrl2());
            }
        }

        this.handleDynamicLiveStream();
    }, delay + 50);
}



    
    async requestWakeLock() {
    if ('wakeLock' in navigator) {
        try {
            if (!this.state.wakeLock) {
                this.state.wakeLock = await navigator.wakeLock.request('screen').catch(() => null);
                if (this.state.wakeLock) {
                    this.state.wakeLock.addEventListener('release', () => { this.state.wakeLock = null; });
                }
            }
        } catch (err) {}
    }
}
    
 
 async loadStoredChunks() {
        this.ui.els.startBtn.disabled = true;
        this.ui.els.statusDisplay.innerText = "";
        this.ui.els.statusDisplay.className = "status-frozen";

        const keys = await this.chunkDB.getAllKeys();
        if (!keys || keys.length === 0) {
            this.state.isStopped = true;
            this.state.isPlaying = false;
            this.state.isNetworkFrozen = true;
            
            this.ui.els.statusDisplay.innerText = "";
            this.ui.els.statusDisplay.className = "";
            this.ui.update();
            return;
        }

        keys.sort((a, b) => (parseInt(a.split('_')[1]) || 0) - (parseInt(b.split('_')[1]) || 0));

        const KEEP_CHUNKS = 120;
        if (keys.length > KEEP_CHUNKS) {
            const excessKeys = keys.slice(0, keys.length - KEEP_CHUNKS);
            keys.splice(0, keys.length - KEEP_CHUNKS);

            await new Promise((resolve, reject) => {
                const tx = this.chunkDB.db.transaction(this.chunkDB.storeName, "readwrite");
                const store = tx.objectStore(this.chunkDB.storeName);
                
                excessKeys.forEach(key => store.delete(key));

                tx.oncomplete = () => resolve();
                tx.onerror = (e) => reject(tx.error || e.target.error);
                tx.onabort = () => reject(new Error("Transaction aborted"));
            });
        }
        
        const loadedChunks = [];
        for (let key of keys) {
            const rawData = await this.chunkDB.get(key);
            if (rawData && rawData.length > 0) {
                loadedChunks.push({
                    id: key,
                    length: rawData.length,
                    startTime: parseInt(key.split('_')[1], 10) || Date.now()
                });
            }
        }
        
        if (loadedChunks.length > 0) {
            this.state.isStopped = false;
            this.state.isPlaying = false;
            this.state.isNetworkFrozen = true;
            this.state.firstChunkTimestamp = loadedChunks[0].startTime;

            const lastActiveId = await this.chunkDB.getSetting("lastPlayingChunkId");
            let targetIndex = lastActiveId ? loadedChunks.findIndex(c => c.id === lastActiveId) : -1;

            if (targetIndex !== -1) {
                this.state.playedChunksHistory = loadedChunks.slice(0, targetIndex);
                this.state.playlistChunks = loadedChunks.slice(targetIndex);
            } else {
                 if (loadedChunks.length > 1) {
                    this.state.playedChunksHistory = loadedChunks.slice(0, -1);
                    this.state.playlistChunks = [loadedChunks[loadedChunks.length - 1]];
                } else {
                    this.state.playlistChunks = [loadedChunks[0]];
                }
            }
        } else {
            this.state.isStopped = true;
            this.state.isNetworkFrozen = true;
        }
        
        this.ui.update();
        this.ui.els.statusDisplay.innerText = "Timeshift (Loaded)";
        this.ui.els.statusDisplay.className = "status-frozen";
        this.ui.els.startBtn.disabled = false;
        this.ui.els.startBtn.innerText = "Start Timeshift";
    }
    

    async startRadio() {
        if (!this.state.isStopped) return;

        this.state.playlistChunks = [];
        this.state.playedChunksHistory = [];
        this.state.currentPlayingChunkData = null;

        this.streamer.connect();
        
        this.state.isStopped = false;
        this.state.firstChunkTimestamp = Date.now();
        this.state.isNetworkFrozen = false;
        
        await this.player.initAudioContext();
        
        this.state.isPlaying = false;
        this.requestWakeLock();
    }
    
        async toggleNetworkFreeze() {
        if (this.state.isStopped) return;
        
        if (!this.state.isNetworkFrozen) {
             if (this.streamer && this.streamer.chunkProcessor) {
                await this.streamer.chunkProcessor.process(new Uint8Array(0), true);
            }
        }

        this.state.isNetworkFrozen = !this.state.isNetworkFrozen;
        
        if (this.state.isNetworkFrozen) {
            this.streamer.disconnect();
        } else {
            await this.streamer.connect();
        }
        this.ui.update();
    }

    
    registerServiceWorker() {
        if ('serviceWorker' in navigator) {
            let refreshing = false;

            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (!refreshing) {
                    refreshing = true;
                    window.location.reload();
                }
            });

            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').then((registration) => {
                    registration.update();
                }).catch(() => {});
            });
        }
    }


}

class UIManager {
    constructor(app) {
        this.app = app;
        this.state = app.state;
        this.els = {};
        this.isLiveSwitching = false;

        this.icons = {
            play: `<svg viewBox="0 0 24 24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>`,
            pause: `<svg viewBox="0 0 24 24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>`,
        };
    }
    
    collectElements() {
        const ids = [
            "statusDisplay", "bufferIcon", "rewind-bar-fg", "buffer-bar-fg", 
            "liveStationSelect", "stationSelect", "liveAudio", "liveBtn", "startBtn",
            "stopSwitch", "rewindBtn", "skipBtn", "rewindBtn2", "skipBtn2", 
            "volumeSlider", "sleepTimerSlider"
        ];
        ids.forEach(id => this.els[id] = document.getElementById(id));
        this.els.switchContainer = document.querySelector(".switch-container");
    }

    async initStations() {
        this.app.stations.forEach((station, index) => {
            const option = document.createElement('option');
            option.value = index;
            option.textContent = station.name;
            this.els.stationSelect.appendChild(option);
        });

        this.app.livestations.forEach((station, index) => {
            const option = document.createElement('option');
            option.value = index;
            option.textContent = station.name;
            this.els.liveStationSelect.appendChild(option);
        });

        let savedIndex = await this.app.chunkDB.getSetting("selectedStationIndex") || 0;
        this.els.stationSelect.value = savedIndex;
        this.state.streamUrl = this.app.stations[savedIndex].url;
        this.state.bitrate = this.app.stations[savedIndex].bitrate;

        let savedLiveIndex = await this.app.chunkDB.getSetting("selectedLiveStationIndex") || 0;
        this.els.liveStationSelect.value = savedLiveIndex;
        
        this.els.startBtn.innerHTML = this.icons.play;
    }
    
    bindEvents() {
    this.els.liveBtn.addEventListener('click', () => {
        if (!this.state.isLiveMode) this.startLiveMode();
        else this.stopLiveMode();
    });

    this.els.startBtn.addEventListener('click', () => {
        if (this.state.isLiveMode) this.stopLiveMode();
        if (this.state.isDecoding) return;
        
        if (this.state.isStopped) this.app.startRadio();
        else if (this.state.isPlaying) this.app.player.pause();
        else this.app.player.play();
        this.update();
    });
    
    this.bindSwitch();

    this.els.rewindBtn.addEventListener('click', () => this.app.player.jumpChunks(-1));
    this.els.rewindBtn2.addEventListener('click', () => this.app.player.jumpChunks(-10));
    this.els.skipBtn.addEventListener('click', () => this.app.player.jumpChunks(1));
    this.els.skipBtn2.addEventListener('click', () => this.app.player.jumpChunks(10));
    
    this.els.stationSelect.addEventListener('change', (e) => this.handleStationChange(e));
    this.els.liveStationSelect.addEventListener('change', (e) => this.handleLiveStationChange(e));
    
    this.els.volumeSlider.addEventListener('input', (e) => this.handleVolumeChange(e));
    this.els.sleepTimerSlider.addEventListener('input', (e) => this.handleSleepTimerChange(e));
    
    window.addEventListener('online', () => this.app.streamer.ensureConnection());
    window.addEventListener('beforeunload', (e) => { e.preventDefault(); e.returnValue = true; });
    document.addEventListener('visibilitychange', () => {
        if (this.state.wakeLock && document.visibilityState === 'visible') {
            this.app.requestWakeLock();
        }
    });
}

    bindSwitch() {
        let isDragging = false, startX = 0, currentTranslate = 0;
        const switchButton = this.els.switchContainer.querySelector('.switch-button');

        const onPointerDown = (e) => {

            if (this.state.isLiveMode || this.state.isDecoding) return;
            isDragging = true;
            startX = e.clientX || (e.touches ? e.touches[0].clientX : 0);
            switchButton.style.transition = 'none';
            e.preventDefault();
        };

        const onPointerMove = (e) => {
            if (!isDragging) return;
            const currentX = e.clientX || (e.touches ? e.touches[0].clientX : 0);
            const diffX = currentX - startX;
            const maxSlide = this.els.switchContainer.offsetWidth / 2 - 6;
            const baseOffset = this.els.stopSwitch.checked ? maxSlide : 0;
            currentTranslate = Math.max(-baseOffset, Math.min(maxSlide - baseOffset, diffX));
            switchButton.style.transform = `translateX(${baseOffset + currentTranslate}px)`;
        };

        const onPointerUp = async () => {
            if (!isDragging) return;
            isDragging = false;
            switchButton.style.transition = 'transform 0.25s cubic-bezier(0.4, 0, 0.2, 1)';
            const threshold = (this.els.switchContainer.offsetWidth / 2 - 6) * 0.3;
            let shouldToggle = (this.els.stopSwitch.checked && currentTranslate < -threshold) || 
                               (!this.els.stopSwitch.checked && currentTranslate > threshold);
            
            if (shouldToggle) {
                if (this.state.isStopped) {

                    await this.app.startRadio();
                } else {
                    await this.app.toggleNetworkFreeze();
                }
            } else {
                this.update();
            }
            currentTranslate = 0;
        };
        
        this.els.switchContainer.addEventListener('pointerdown', onPointerDown);
        window.addEventListener('pointermove', onPointerMove);
        window.addEventListener('pointerup', onPointerUp);
        this.els.switchContainer.querySelector('.switch-label').addEventListener('click', (e) => e.preventDefault());
    }
    

    async handleStationChange(e) {
        const idx = parseInt(e.target.value, 10);
        this.state.streamUrl = this.app.stations[idx].url;
        this.state.bitrate = this.app.stations[idx].bitrate;
        await this.app.chunkDB.setSetting("selectedStationIndex", idx);
        
        if (!this.state.isStopped && !this.state.isNetworkFrozen) {
            this.app.streamer.disconnect();
            this.app.streamer.connect();
        }
    }
    
    async handleLiveStationChange(e) {
        const idx = parseInt(e.target.value, 10);
        await this.app.chunkDB.setSetting("selectedLiveStationIndex", idx);
        if (this.state.isLiveMode) {
            this.stopLiveMode();
            this.startLiveMode();
        }
    }

    handleVolumeChange(e) {
        const volume = e.target.value;
        const linearVolume = volume / 100;
        const finalGain = this.getPerceivedGain(linearVolume);
        
        if (this.state.isLiveMode) this.els.liveAudio.volume = finalGain;
        if (this.app.player.gainNode) this.app.player.gainNode.gain.setValueAtTime(finalGain, this.app.player.audioCtx.currentTime);

        e.target.style.background = `linear-gradient(to right, var(--clr-slider) ${volume}%, #444 ${volume}%)`;
    }

    handleSleepTimerChange(e) {
        const minutes = parseInt(e.target.value) || 0;
        const percentage = (minutes / (parseInt(e.target.max) || 60)) * 100;
        e.target.style.background = `linear-gradient(to right, var(--clr-slider) ${percentage}%, #444 ${percentage}%)`;
        this.state.sleepTimerEndTime = minutes > 0 ? Date.now() + minutes * 60000 : null;
    }
    
    startLiveMode() {
        if (this.state.isLiveMode) return;
        this.app.player.pause();

        const selected = this.app.livestations[this.els.liveStationSelect.value];
        let url = selected.url;
        if (url === "dynamic") url = this.app.getLiveUrl();
        else if (url === "dynamic_aac") url = this.app.getLiveUrl2();

        this.els.liveAudio.src = url;
        this.els.liveAudio.load();
        this.els.liveAudio.play().catch(()=>{});
        this.state.isLiveMode = true;
        
        this.updateMediaSession(selected.name, "Live Radio Stream");
        this.update();
        this.app.handleDynamicLiveStream(true);
    }
    
    stopLiveMode() {
        if (!this.state.isLiveMode) return; 
        this.state.isLiveMode = false;
        this.els.liveAudio.pause();
        this.els.liveAudio.removeAttribute('src');
        this.els.liveAudio.load();
        if (this.app.dynamicStreamTimeout) {
        clearTimeout(this.app.dynamicStreamTimeout);
        this.app.dynamicStreamTimeout = null;
    }
        this.update();
    }
    
switchLiveStreamTo(url) {

    if (this.isLiveSwitching || !url || (this.els.liveAudio.src && new URL(url, window.location.href).href === this.els.liveAudio.src)) {
        return;
    }
    this.isLiveSwitching = true;

    const oldAudio = this.els.liveAudio;


    const preloader = new Audio();
    preloader.muted = true;
    preloader.crossOrigin = "anonymous";

    const cleanup = () => {
        preloader.removeEventListener('canplay', handleCanPlay);
        preloader.removeEventListener('error', handleError);
        preloader.pause();
        preloader.src = "";
        this.isLiveSwitching = false;
    };


    const handleCanPlay = () => {

        oldAudio.pause();
        oldAudio.removeAttribute("src");
        oldAudio.load();
        

        oldAudio.src = url;
        

        const currentVolume = this.els.volumeSlider.value / 100;
        oldAudio.volume = this.getPerceivedGain(currentVolume);
        oldAudio.play().catch(() => { });

        cleanup();
    };

    const handleError = () => {
        cleanup();
    };


    preloader.addEventListener('canplay', handleCanPlay);
    preloader.addEventListener('error', handleError);


    preloader.src = url;
    preloader.load();
    preloader.play().catch(()=>{

    });
}






    update() {
        this.updateBufferBars();
        this.updateStatusDisplay();
        this.updateButtons();
        this.updateControls();
        this.updateSleepTimerSlider();
    }

    updateBufferBars() {
        let forwardPercent = 0, rewindPercent = 0;
        const MAX_CHUNKS = 60;
        
        if (!this.state.isStopped) {
            rewindPercent = Math.min((this.state.playedChunksHistory.length / MAX_CHUNKS) * 100, 100);
            forwardPercent = Math.min((this.state.playlistChunks.length / MAX_CHUNKS) * 100, 100);
        }
        
        this.els["rewind-bar-fg"].style.width = `${rewindPercent}%`;
        this.els["buffer-bar-fg"].style.width = `${forwardPercent}%`;
        
        const barClass = !this.state.isStopped && !this.state.isNetworkFrozen && this.state.isConnected ? 'actively-buffering' : 'buffer-underrun';
        this.els["rewind-bar-fg"].className = barClass;
        this.els["buffer-bar-fg"].className = barClass;
    }
    

	updateStatusDisplay() {
	    const formatBufferDuration = (s) => {
	        const d = Math.max(0, Math.floor(s));
	        const h = Math.floor(d / 3600);
	        const m = Math.floor((d % 3600) / 60);
	        const sec = Math.floor(d % 60);
	        return h > 0 ?
	            `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}` :
	            `${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
	    };
	
	    const formatTime = (ts) => {
	        const d = new Date(ts);
	        

	        const userLang = navigator.language || 'en';

	        const weekdays = userLang.startsWith('de')
	            ? ["So", "Mo", "Di", "Mi", "Do", "Fr", "Sa"] // Deutsch
	            : ["Su", "Mo", "Tu", "We", "Th", "Fr", "Sa"]; // Englisch (2 Buchstaben)
	
	        return `${weekdays[d.getDay()]} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
	    };
	
	    const getPlaybackTime = () => {
	        if (this.state.currentPlayingChunkData) {
	            return this.state.currentPlayingChunkData.startTime;
	        }
	        if (this.state.playlistChunks.length > 0) {
	            return this.state.playlistChunks[0].startTime;
	        }
	        if (this.state.playedChunksHistory.length > 0) {
	            return this.state.playedChunksHistory[this.state.playedChunksHistory.length - 1].startTime;
	        }
	        return this.state.firstChunkTimestamp || Date.now();
	    };
	
	    const getNewestTime = () => {
	        const lastPlaylist = this.state.playlistChunks.length > 0 
	            ? this.state.playlistChunks[this.state.playlistChunks.length - 1].startTime 
	            : 0;
	
	        const currentPlaying = this.state.currentPlayingChunkData
	            ? this.state.currentPlayingChunkData.startTime
	            : 0;
	
	        const newestSaved = Math.max(lastPlaylist, currentPlaying);
	
	        if (newestSaved > 0) {
	            return newestSaved;
	        }
	        return Date.now();
	    };
	
	    let totalBufferSeconds = 0;
	    const bytesPerSecond = this.state.bitrate / 8;
	
	    if (bytesPerSecond > 0 && !this.state.isStopped) {
	        totalBufferSeconds = this.state.playlistChunks.reduce((acc, c) => acc + (c.length / bytesPerSecond), 0);
	        
	        const player = this.app.player;
	        const currentChunk = this.state.currentPlayingChunkData;
	        
	        if (this.state.isPlaying && currentChunk && player.currentChunkStartTime > 0 && player.audioCtx) {
	            const elapsed = player.audioCtx.currentTime - player.currentChunkStartTime;
	            const remainingInChunk = (currentChunk.length / bytesPerSecond) - elapsed;
	            totalBufferSeconds += Math.max(0, remainingInChunk);
	        } else if (this.state.isManualPause) {
	            if (this.state.playlistChunks.length > 0 && player.currentChunkOffset > 0) {
	                 const firstChunkInPlaylist = this.state.playlistChunks[0];
	                 const firstChunkDuration = firstChunkInPlaylist.length / bytesPerSecond;
	                 totalBufferSeconds -= player.currentChunkOffset;
	            }
	        }
	        
	        if (!this.state.isNetworkFrozen && this.app.streamer.chunkProcessor.rawBuffer) {
	            totalBufferSeconds += this.app.streamer.chunkProcessor.rawBuffer.length / bytesPerSecond;
	        }
	    }
	
	    const bufferText = `(${formatBufferDuration(totalBufferSeconds)})`;
	    const timeRange = `${formatTime(getPlaybackTime())} ➔ ${formatTime(getNewestTime())}`;
	
	    let statusText = "";
	    let statusClass = "";
	
	    if (this.state.isLiveMode) {
	        const stationName = this.els.liveStationSelect.options[this.els.liveStationSelect.selectedIndex]?.text || "";
	        statusText = `Live - ${stationName}`;
	        statusClass = (!this.state.isStopped && !this.state.isNetworkFrozen) ? "status-buffering-active" : "status-live";
	    } 
	    else if (!this.state.isStopped) {
	        let mode = 'Rec';
	        
	        if (!this.state.isNetworkFrozen && !this.state.isConnected) {
	            mode = this.state.isPlaying ? 'Play' : 'Try';
	            statusClass = "status-frozen";
	        } else {
	            if (this.state.isPlaying) {
	                mode = 'Play';
	            } else if (this.state.isNetworkFrozen) {
	                mode = 'Stop';
	            }
	            statusClass = this.state.isNetworkFrozen ? "status-buffering-idle" : "status-buffering-active";
	        }
	        
	        statusText = `${mode} - ${timeRange} ${bufferText}`;
	    } 
	    else {
	        const rangeStr = this.state.firstChunkTimestamp ? ` - ${timeRange} ${bufferText}` : "";
	        statusText = `Stop${rangeStr}`;
	        statusClass = "status-frozen";
	    }
	    
	    this.els.statusDisplay.innerText = statusText;
	    this.els.statusDisplay.className = statusClass;
	}
	


    updateButtons() {

        const shouldBeDisabled = this.state.isLiveMode ||
                                 (!canPlay) ||

                <span style="letter-spacing:0;">LIVE</span>

    }


    updateControls() {
        this.els.stationSelect.disabled = this.state.isLiveMode || (!this.state.isStopped && !this.state.isNetworkFrozen);
        this.els.liveStationSelect.disabled = this.state.isPlaying;

        this.els.stopSwitch.checked = !this.state.isNetworkFrozen;
        
        this.els.stopSwitch.disabled = this.state.isLiveMode;

        switchButton.style.transform = this.els.stopSwitch.checked ? 'translateX(100%)' : 'translateX(0)';
    }
    

    updateSleepTimerSlider() {
        if (!this.state.sleepTimerEndTime) {
            this.els.sleepTimerSlider.value = 0;
            this.els.sleepTimerSlider.style.background = `linear-gradient(to right, var(--clr-slider) 0%, #444 0%)`;
            return;
        }
        const remainingMinutes = Math.ceil((this.state.sleepTimerEndTime - Date.now()) / 60000);
        const max = parseInt(this.els.sleepTimerSlider.max) || 60;
        const percentage = (remainingMinutes / max) * 100;
        this.els.sleepTimerSlider.value = remainingMinutes;
        this.els.sleepTimerSlider.style.background = `linear-gradient(to right, var(--clr-slider) ${percentage}%, #444 ${percentage}%)`;

    updateMediaSession(title, artist) {
    if ('mediaSession' in navigator) {
        try {
            navigator.mediaSession.metadata = new MediaMetadata({ title, artist, album: 'Radio Player' });
            const setHandler = (action, handler) => {
                try { navigator.mediaSession.setActionHandler(action, handler); } catch (e) {}
            };
            setHandler('play', () => this.state.isLiveMode ? this.els.liveAudio.play().catch(()=>{}) : this.app.player.play());
            setHandler('pause', () => this.state.isLiveMode ? this.els.liveAudio.pause() : this.app.player.pause());
            setHandler('stop', () => this.state.isLiveMode ? this.stopLiveMode() : this.app.toggleNetworkFreeze());
        } catch (e) {}
    }
}

    getPerceivedGain(linearVolume) {
        if (linearVolume <= 0) return 0;
        if (linearVolume >= 1) return 1.0;
        return Math.min(1.0, Math.pow(linearVolume, 0.35) * (1.2 - 0.2 * linearVolume));
    }
}

class StreamManager {
    constructor(app) {
        this.app = app;
        this.state = app.state;
        this.chunkProcessor = new ChunkProcessor(app);
        this.reader = null;
        this.controller = null;
        this.lastConnectTime = 0;
    }
    
    async connect() {
        if (this.state.isStopped || this.state.isNetworkFrozen || this.state.isConnecting) return;
        this.lastConnectTime = Date.now();
        this.disconnect(true);
        this.controller = new AbortController();
        this.state.isConnecting = true;
        this.state.lastDataTime = Date.now();
        try {
            const url = this.state.streamUrl + (this.state.streamUrl.includes("?") ? "&" : "?") + "t=" + Date.now();
            const response = await fetch(url, { signal: this.controller.signal, cache: "no-store", mode: "cors" });
            if (!response.ok) throw new Error("Server-Antwort war nicht OK: " + response.statusText);
            this.reader = response.body.getReader();
            this.state.isConnecting = false;
            this.state.isConnected = true;
            this.chunkProcessor.prepareReconnect();
            await this.readLoop();
        } catch (e) {
            console.error("[StreamManager] Verbindungsfehler:", e);
            this.state.isConnected = false;
            this.state.isConnecting = false;
            this.reader = null;
        }
    }

    disconnect(forceFlush = false) {
        if (forceFlush && this.chunkProcessor) {
            this.chunkProcessor.process(new Uint8Array(0), true);
        }
        if (this.controller) { 
            try { this.controller.abort(); } catch(e) {} 
        }
        if (this.reader) { 
            this.reader.cancel().catch(() => {}); 
        }
        this.controller = null;
        this.reader = null;
        this.state.isConnected = false;
        this.state.isConnecting = false;
    }
    
    async readLoop() {
        try {
            while (!this.state.isStopped && !this.state.isNetworkFrozen && this.reader) {
                const { done, value } = await this.reader.read();
                if (done) {
                    break;
                }
                await this.chunkProcessor.process(value);
                this.state.isConnected = true;
                this.state.lastDataTime = Date.now();
            }
        } catch (err) {
        } finally { 
            this.disconnect(true); 
        }
    }
    
    ensureConnection() {
        if (this.state.isStopped || this.state.isNetworkFrozen) return;
        const stalled = Date.now() - this.state.lastDataTime > 10000;
        const idle = !this.state.isConnected && !this.state.isConnecting;
        const cooldownPassed = Date.now() - this.lastConnectTime > 5000;
        if (stalled && this.state.isConnected) {
            this.connect();
        } else if (idle && cooldownPassed) {
            this.connect();
        }
    }
}



class ChunkProcessor {
    constructor(app) {
        this.app = app;
        this.state = app.state;
        this.rawBuffer = new Uint8Array(0);
        this.firstChunkInSession = true;
        this.isReconnect = false;
        this.lastChunkTailFrames = [];
    }

    reset() {
        this.rawBuffer = new Uint8Array(0);
        this.firstChunkInSession = true;
        this.isReconnect = false;
        this.lastChunkTailFrames = [];
    }

    prepareReconnect() {
        this.rawBuffer = new Uint8Array(0);
        this.isReconnect = true;
        this.firstChunkInSession = true;
    }

    extractTailFrameSignatures(chunkData, count = 8) {
        const signatures = [];
        let pos = 0;
        const frames = [];

        while (pos < chunkData.length) {
            const size = this.getFrameSize(chunkData, pos);
            if (size <= 0 || pos + size > chunkData.length) break;
            frames.push({ pos, size });
            pos += size;
        }

        const tail = frames.slice(-count);
        for (const f of tail) {
            const sigLen = Math.min(16, f.size);
            const sig = chunkData.subarray(f.pos, f.pos + sigLen);
            signatures.push({ size: f.size, sig: Array.from(sig) });
        }
        return signatures;
    }

    findOverlapOffset(buffer) {
        if (!this.lastChunkTailFrames || this.lastChunkTailFrames.length === 0) return -1;

        const targetFrame = this.lastChunkTailFrames[this.lastChunkTailFrames.length - 1];
        const targetSig = targetFrame.sig;

        for (let i = 0; i < buffer.length - targetSig.length; i++) {
            if (buffer[i] === targetSig[0] && buffer[i + 1] === targetSig[1]) {
                let match = true;
                for (let j = 0; j < targetSig.length; j++) {
                    if (buffer[i + j] !== targetSig[j]) {
                        match = false;
                        break;
                    }
                }
                if (match) {
                    return i + targetFrame.size;
                }
            }
        }
        return -1;
    }

    async storeChunk(chunkData) {
        if (!chunkData || chunkData.length === 0) {
            return;
        }

        if (!this.state.firstChunkTimestamp) {
            this.state.firstChunkTimestamp = Date.now();
        }

        const isValid = await this.isValidAudioChunk(chunkData);
        
        if (!isValid) {
            return;
        }

        this.lastChunkTailFrames = this.extractTailFrameSignatures(chunkData);
        
        const chunkId = `c_${Date.now()}_${Math.random().toString(36).substr(2, 5)}`;
        
        try {
            await this.app.chunkDB.set(chunkId, chunkData);
            
            this.state.playlistChunks.push({
                id: chunkId,
                length: chunkData.length,
                startTime: Date.now()
            });
        } catch (e) {
        }
    }

        getFrameSize(data, pos) {
        if (pos + 4 > data.length) return -1;
        if (data[pos] !== 0xFF || (data[pos + 1] & 0xE0) !== 0xE0) return -1;

        const mpegVersion = (data[pos + 1] & 0x18) >> 3;
        const layer = (data[pos + 1] & 0x06) >> 1;
        
        if (mpegVersion === 1 || layer !== 1) return -1;

        const bitrateIdx = (data[pos + 2] & 0xF0) >> 4;
        const sampleRateIdx = (data[pos + 2] & 0x0C) >> 2;
        const padding = (data[pos + 2] & 0x02) >> 1;

        if (bitrateIdx === 0 || bitrateIdx === 15 || sampleRateIdx === 3) return -1;

        const bitratesMPEG1 = [0, 32, 40, 48, 56, 64, 80, 96, 112, 128, 160, 192, 224, 256, 320, 0];
        const bitratesMPEG2 = [0, 8, 16, 24, 32, 40, 48, 56, 64, 80, 96, 112, 128, 144, 160, 0];
        
        const sampleRatesMPEG1 = [44100, 48000, 32000];
        const sampleRatesMPEG2 = [22050, 24000, 16000];
        const sampleRatesMPEG25 = [11025, 12000, 8000];

        let bitrate = (mpegVersion === 3) ? bitratesMPEG1[bitrateIdx] * 1000 : bitratesMPEG2[bitrateIdx] * 1000;
        
        let sampleRate;
        if (mpegVersion === 3) {
            sampleRate = sampleRatesMPEG1[sampleRateIdx];
        } else if (mpegVersion === 2) {
            sampleRate = sampleRatesMPEG2[sampleRateIdx];
        } else if (mpegVersion === 0) {
            sampleRate = sampleRatesMPEG25[sampleRateIdx];
        } else {
            return -1;
        }

        if (!bitrate || !sampleRate) return -1;

        const coefficients = (mpegVersion === 3) ? 144 : 72;
        return Math.floor((coefficients * bitrate) / sampleRate) + padding;
    }



    findFirstValidHeaderChain(data, offset, requiredChainLength = 3) {
        for (let i = offset; i < data.length - 4; i++) {
            if (data[i] === 0xFF && (data[i + 1] & 0xE0) === 0xE0) {
                let currentPos = i;
                let validChain = 0;

                while (currentPos < data.length && validChain < requiredChainLength) {
                    let frameSize = this.getFrameSize(data, currentPos);
                    if (frameSize <= 0) break;
                    
                    currentPos += frameSize;
                    validChain++;
                }

                if (validChain >= requiredChainLength) {
                    return i;
                }
            }
        }
        return -1;
    }


    process(newData, forceFlush = false) {
        let combined = new Uint8Array(this.rawBuffer.length + newData.length);
        combined.set(this.rawBuffer);
        combined.set(newData, this.rawBuffer.length);
        this.rawBuffer = combined;
        
        if (this.isReconnect && this.rawBuffer.length > 0) {
            const overlapOffset = this.findOverlapOffset(this.rawBuffer);
            if (overlapOffset !== -1) {
                this.rawBuffer = this.rawBuffer.subarray(overlapOffset);
            }
            this.isReconnect = false;
        }
        
        const bytesPerChunk = (this.state.bitrate / 8) * 60;
        const safeBufferSize = bytesPerChunk + 65536;

        while (this.rawBuffer.length >= safeBufferSize) {
            let startPos = this.firstChunkInSession ? this.findFirstValidHeaderChain(this.rawBuffer, 0) : 0;
            
            if (startPos === -1) { 
                this.rawBuffer = new Uint8Array(0); 
                break; 
            }
            if (startPos > 0) {
                this.rawBuffer = this.rawBuffer.subarray(startPos);
            }
            
            this.firstChunkInSession = false;
            let currentPos = 0;
            let validSegments = [];
            let segmentStart = 0;
            let accumulatedLength = 0;

            while (currentPos < this.rawBuffer.length && (accumulatedLength + (currentPos - segmentStart)) < bytesPerChunk) {
                let frameSize = this.getFrameSize(this.rawBuffer, currentPos);
                if (frameSize <= 0 || currentPos + frameSize > this.rawBuffer.length) {
                    if (currentPos > segmentStart) {
                        validSegments.push(this.rawBuffer.subarray(segmentStart, currentPos));
                        accumulatedLength += (currentPos - segmentStart);
                    }
                    if (frameSize <= 0) {
                        let nextSync = this.findFirstValidHeaderChain(this.rawBuffer, currentPos + 1);
                        if (nextSync !== -1) { 
                            currentPos = nextSync; 
                            segmentStart = nextSync;
                            continue; 
                        } else {
                            segmentStart = this.rawBuffer.length;
                            currentPos = this.rawBuffer.length;
                            break;
                        }
                    } else {
                        segmentStart = currentPos;
                        break;
                    }
                }

                if ((accumulatedLength + (currentPos - segmentStart) + frameSize) > bytesPerChunk) {
                    break;
                }
                
                currentPos += frameSize;
            }

            if (currentPos > segmentStart) {
                validSegments.push(this.rawBuffer.subarray(segmentStart, currentPos));
                accumulatedLength += (currentPos - segmentStart);
            }

            if (accumulatedLength > 0) {
                const chunkData = new Uint8Array(accumulatedLength);
                let offset = 0;
                for (const seg of validSegments) {
                    chunkData.set(seg, offset);
                    offset += seg.length;
                }
                this.rawBuffer = this.rawBuffer.subarray(currentPos);
                this.storeChunk(chunkData);
            } else {
                if (this.rawBuffer.length >= safeBufferSize) {
                    this.rawBuffer = this.rawBuffer.subarray(safeBufferSize);
                }
                break;
            }
        }

        if (forceFlush && this.rawBuffer.length > 0) {
            let currentPos = 0;
            let validSegments = [];
            let segmentStart = 0;
            let accumulatedLength = 0;

            while (currentPos < this.rawBuffer.length) {
                let frameSize = this.getFrameSize(this.rawBuffer, currentPos);
                if (frameSize <= 0 || currentPos + frameSize > this.rawBuffer.length) {
                    if (currentPos > segmentStart) {
                        validSegments.push(this.rawBuffer.subarray(segmentStart, currentPos));
                        accumulatedLength += (currentPos - segmentStart);
                    }
                    if (frameSize <= 0) {
                        let nextSync = this.findFirstValidHeaderChain(this.rawBuffer, currentPos + 1);
                        if (nextSync !== -1) {
                            currentPos = nextSync;
                            segmentStart = nextSync;
                            continue;
                        } else {
                            segmentStart = this.rawBuffer.length;
                            currentPos = this.rawBuffer.length;
                            break;
                        }
                    } else {
                        segmentStart = currentPos;
                        break;
                    }
                }
                currentPos += frameSize;
            }

            if (currentPos > segmentStart) {
                validSegments.push(this.rawBuffer.subarray(segmentStart, currentPos));
                accumulatedLength += (currentPos - segmentStart);
            }

            if (accumulatedLength > 0) {
                const chunkData = new Uint8Array(accumulatedLength);
                let offset = 0;
                for (const seg of validSegments) {
                    chunkData.set(seg, offset);
                    offset += seg.length;
                }
                this.storeChunk(chunkData);
            }
            this.rawBuffer = new Uint8Array(0);
        }
    }



        async isValidAudioChunk(data) {
        if (!data || data.length < 100) return false;
        try {
            const copy = data.buffer.slice(data.byteOffset, data.byteOffset + data.byteLength);
            const buffer = await this.app.player.audioCtx.decodeAudioData(copy);
            return buffer.length > 0;
        } catch(e) { 
            let pos = 0;
            while (pos < data.length) {
                let frameSize = this.getFrameSize(data, pos);
                if (frameSize <= 0 || pos + frameSize > data.length) {
                    return false;
                }
                pos += frameSize;
            }
            return pos === data.length;
        }
    }

}



class Player {
    constructor(app) {
        this.app = app;
        this.state = app.state;
        this.audioCtx = null;
        this.gainNode = null;
        this.activeSources = new Set();
        this.playbackTimeoutId = null;
        this.virtualPlayTime = 0;
        this.currentChunkStartTime = 0;
        this.isRebuffering = false;
        this.currentChunkOffset = 0;
        
        const workerCode = `
            self.onmessage = e => { 
                const { id, buffer } = e.data;
                self.postMessage({ id, buffer }, [buffer]); 
            };
        `;
        const blob = new Blob([workerCode], { type: 'application/javascript' });
        const workerUrl = URL.createObjectURL(blob);

        this.audioWorker = new Worker(workerUrl);
        URL.revokeObjectURL(workerUrl); 
        this.workerMsgId = 0;
        this.jumpGeneration = 0;
    }

    async initAudioContext() {
        if (this.audioCtx && this.audioCtx.state !== 'closed') return;
        this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (this.audioCtx.state === "suspended") await this.audioCtx.resume();
        this.gainNode = this.audioCtx.createGain();
        const finalGain = this.app.ui.getPerceivedGain(this.app.ui.els.volumeSlider.value / 100);
        this.gainNode.gain.setValueAtTime(finalGain, this.audioCtx.currentTime);
        this.gainNode.connect(this.audioCtx.destination);
    }
    
    async play() {
        await this.initAudioContext();
        if (this.audioCtx.state === "suspended") await this.audioCtx.resume();

        const finalGain = this.app.ui.getPerceivedGain(this.app.ui.els.volumeSlider.value / 100);
        this.gainNode.gain.setValueAtTime(finalGain, this.audioCtx.currentTime);

        this.state.isManualPause = false;
        this.state.isPlaying = true;
        this.isRebuffering = false;

        if (!this.state.hasStartedPlayback) {
            this.virtualPlayTime = this.audioCtx.currentTime;
        }
        
        this.app.requestWakeLock();
        this.playbackLoop();
        this.app.ui.updateMediaSession(this.app.stations[this.app.ui.els.stationSelect.value].name, "Timeshift Live Buffer");
    }

    pause(isManualAction = true) {
    if (isManualAction) {
        this.state.isManualPause = true;
        this.state.isPlaying = false;
        this.isRebuffering = false;
    }


    if (this.state.currentPlayingChunkData && this.currentChunkStartTime > 0 && this.audioCtx) {
        const elapsed = Math.max(0, this.audioCtx.currentTime - this.currentChunkStartTime);
        this.currentChunkOffset += elapsed;
        

        this.state.playlistChunks.unshift(this.state.currentPlayingChunkData);
        this.state.currentPlayingChunkData = null;
    }

    this.resetScheduledPlayback();

    if (this.gainNode) {
        this.gainNode.gain.cancelScheduledValues(this.audioCtx.currentTime);
        this.gainNode.gain.setValueAtTime(0, this.audioCtx.currentTime);
    }
   
    if (this.state.wakeLock) { 
        this.state.wakeLock.release().catch(() => {}); 
        this.state.wakeLock = null; 
    }
    if ('mediaSession' in navigator) navigator.mediaSession.playbackState = "paused";
}

    resetScheduledPlayback() {
    this.jumpGeneration++;
    this.virtualPlayTime = 0;
    this.currentChunkStartTime = 0;

    if (!this.state.isManualPause) {
        this.currentChunkOffset = 0;
    }
    if (this.playbackTimeoutId) clearTimeout(this.playbackTimeoutId);
    this.activeSources.forEach(src => { try { src.stop(0); src.disconnect(); } catch (e) {} });
    this.activeSources.clear();
}
    
    async playbackLoop() {
    if (!this.state.isPlaying || this.state.isStopped || !this.audioCtx) {
        return;
    }

    const currentGeneration = this.jumpGeneration;
    const now = this.audioCtx.currentTime;

    if (this.virtualPlayTime < now) {
        this.virtualPlayTime = now + 0.05;
    }

    const scheduleAheadTime = 10.0;

    if ((this.virtualPlayTime - now) > scheduleAheadTime || this.state.isDecoding) {
        if (currentGeneration === this.jumpGeneration) {
            this.playbackTimeoutId = setTimeout(() => this.playbackLoop(), 100);
        }
        return;
    }

    if (this.isRebuffering) {
        if (this.state.playlistChunks.length >= 2 || !this.state.isConnected) {
            this.isRebuffering = false;
        } else {
            if (currentGeneration === this.jumpGeneration) {
                this.playbackTimeoutId = setTimeout(() => this.playbackLoop(), 200);
            }
            return;
        }
    }

    if (this.state.playlistChunks.length === 0) {
        if (now >= this.virtualPlayTime) {
            this.isRebuffering = true;
        }
        if (currentGeneration === this.jumpGeneration) {
            this.playbackTimeoutId = setTimeout(() => this.playbackLoop(), 250);
        }
        return;
    }

    this.state.isDecoding = true;
    
    const chunkEntry = this.state.playlistChunks.shift();

    try {
        const rawData = await this.app.chunkDB.get(chunkEntry.id);
        
        if (currentGeneration !== this.jumpGeneration) {
            return; 
        }

        if (!rawData) {
            return;
        }

        const isolatedBuffer = await new Promise((resolve, reject) => {
            const msgId = ++this.workerMsgId;
            let timerId = null;

            const handler = (e) => {
                if (e.data && e.data.id === msgId) {
                    clearTimeout(timerId);
                    this.audioWorker.removeEventListener('message', handler);
                    resolve(e.data.buffer);
                }
            };

            timerId = setTimeout(() => {
                this.audioWorker.removeEventListener('message', handler);
                reject(new Error("Worker response timeout"));
            }, 500);

            this.audioWorker.addEventListener('message', handler);
            const slicedBuffer = rawData.buffer.slice(0);
            this.audioWorker.postMessage({ id: msgId, buffer: slicedBuffer }, [slicedBuffer]);
        });

        if (currentGeneration !== this.jumpGeneration) {
            return;
        }

        const audioBuffer = await this.audioCtx.decodeAudioData(isolatedBuffer).catch(() => null);
        
        if (currentGeneration !== this.jumpGeneration) {
            return;
        }

        if (!audioBuffer || !this.state.isPlaying) {
            if (audioBuffer && !this.state.isPlaying) {
                this.state.playlistChunks.unshift(chunkEntry);
            }
            return;
        }

        if (this.state.currentPlayingChunkData) {
            this.state.playedChunksHistory.push(this.state.currentPlayingChunkData);
        }
        this.state.currentPlayingChunkData = chunkEntry;
        this.state.hasStartedPlayback = true;
        
        await this.app.chunkDB.setSetting("lastPlayingChunkId", chunkEntry.id);

        this.scheduleChunk(audioBuffer);

    } catch (e) {
    } finally {
        this.state.isDecoding = false;
        
        if (currentGeneration === this.jumpGeneration) {
            this.playbackTimeoutId = setTimeout(() => this.playbackLoop(), 10);
        }
    }
}


   scheduleChunk(buffer) {
    const source = this.audioCtx.createBufferSource();
    source.buffer = buffer;
    this.activeSources.add(source);

    source.connect(this.gainNode);

    const startTime = Math.max(this.audioCtx.currentTime, this.virtualPlayTime);
    const offset = Math.min(this.currentChunkOffset, buffer.duration - 0.1);
    const duration = buffer.duration - offset;

    this.currentChunkOffset = 0;

    source.start(startTime, offset);

    this.currentChunkStartTime = startTime - offset;
    this.virtualPlayTime = startTime + duration;

    source.onended = () => {
        this.activeSources.delete(source);
        try { source.disconnect(); } catch (e) {}
    };
}
   
    
    async jumpChunks(amount) {
        if (this.state.isStopped || this.isJumping) return;

        this.isJumping = true;
        const wasPlaying = this.state.isPlaying;

        this.resetScheduledPlayback();

        if (amount > 0) {
            if (this.state.currentPlayingChunkData) this.state.playedChunksHistory.push(this.state.currentPlayingChunkData);
            const toSkip = Math.min(amount, this.state.playlistChunks.length);
            for (let i = 0; i < toSkip - 1; i++) {
                if (this.state.playlistChunks.length > 0) this.state.playedChunksHistory.push(this.state.playlistChunks.shift());
            }
        } else {
            if (this.state.currentPlayingChunkData) this.state.playlistChunks.unshift(this.state.currentPlayingChunkData);
            const toRewind = Math.min(Math.abs(amount), this.state.playedChunksHistory.length);
            for (let i = 0; i < toRewind; i++) {
                 if (this.state.playedChunksHistory.length > 0) this.state.playlistChunks.unshift(this.state.playedChunksHistory.pop());
            }
        }
        
        this.state.currentPlayingChunkData = null;
        
        if (wasPlaying) {
            await this.playbackLoop();
        }
        
        this.isJumping = false;
        this.app.ui.update();
    }
}
    
new App();
    
</script>
